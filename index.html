:root{
  --bg:#EDF0EF;--card:#FFFFFF;--card2:#F3F5F4;--ink:#0E1D2A;--ink2:#43515C;--ink3:#5C6973;--line:#DDE3E1;
  --brass:#C99A4E;--brass-ink:#7A5719;--brass-soft:#F5ECDA;
  --rain:#3A6E96;--rain-soft:#D6E3ED;--sun:#C4913F;--cloud:#5C6973;--moon:#75838D;
  --ok:#1E6B60;--ok-soft:#E1EFEC;
  --y:#F2C230;--y-soft:#FBF3D3;--y-ink:#574406;--o:#E8862A;--o-soft:#FCE8D6;--o-ink:#6B380A;--r:#C8372D;--r-soft:#F9E0DD;--r-ink:#7C1C15;
  --shadow:0 1px 2px rgba(14,29,42,.05),0 6px 20px -12px rgba(14,29,42,.12);
  --cloud-f:#E6EBEE;--cloud-f2:#F1F4F5;--cloud-f3:#CDD5DB;--sun-f:#FCE6B8;--moon-f:#E9EDF0;--grid:#D8E0DC;--toph:58px;
  --nav:60px;--font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A151E;--card:#12222F;--card2:#182C3B;--ink:#E9EDEC;--ink2:#B5C1C9;--ink3:#93A1AB;--line:#22384A;
  --brass:#E8A867;--brass-ink:#EDB67C;--brass-soft:#2B261C;
  --rain:#7FB3DA;--rain-soft:#203B51;--sun:#E8A867;--cloud:#A7B4BD;--moon:#C6D0D7;
  --ok:#70CFC0;--ok-soft:#13302E;
  --y-soft:#383010;--y-ink:#F4DB88;--o-soft:#3E250E;--o-ink:#F6C390;--r-soft:#43181A;--r-ink:#F4B3AD;
  --cloud-f:#26394A;--cloud-f2:#1C2E3D;--cloud-f3:#33495B;--sun-f:#B8803F;--moon-f:#2A3B49;--grid:#24394A;--shadow:none;--area:.18;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A151E;--card:#12222F;--card2:#182C3B;--ink:#E9EDEC;--ink2:#B5C1C9;--ink3:#93A1AB;--line:#22384A;
  --brass:#E8A867;--brass-ink:#EDB67C;--brass-soft:#2B261C;
  --rain:#7FB3DA;--rain-soft:#203B51;--sun:#E8A867;--cloud:#A7B4BD;--moon:#C6D0D7;
  --ok:#70CFC0;--ok-soft:#13302E;
  --y-soft:#383010;--y-ink:#F4DB88;--o-soft:#3E250E;--o-ink:#F6C390;--r-soft:#43181A;--r-ink:#F4B3AD;
  --cloud-f:#26394A;--cloud-f2:#1C2E3D;--cloud-f3:#33495B;--sun-f:#B8803F;--moon-f:#2A3B49;--grid:#24394A;--shadow:none;--area:.18;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
a{color:var(--brass-ink)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;flex:none}
.wxi{stroke-width:1.5;overflow:visible}.wxi .i-sun{stroke:var(--sun)}.wxi .i-cl{stroke:var(--cloud);fill:var(--cloud-f)}.wxi .i-cl.bk{fill:var(--cloud-f2)}.wxi .i-cl.dk{fill:var(--cloud-f3)}.wxi .i-rn{stroke:var(--rain)}.wxi .i-sn{stroke:var(--rain);stroke-width:1.3}.wxi .i-moon{stroke:var(--moon);fill:var(--moon-f)}.wxi .i-disk{fill:var(--sun-f)}.wxi .i-bolt{stroke:var(--sun);fill:var(--sun-f)}.wxi .i-fog{stroke:var(--cloud)}
.mark .m-cl{stroke:currentColor;stroke-width:1.6}.mark .m-rn{stroke:var(--brass);stroke-width:1.8}

#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(8px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
#main{flex:1;padding:2px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav) + env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px));min-width:0}
.welcome-on #top,.welcome-on #nav{display:none}
.brand{display:inline-flex;align-items:center;min-height:44px;margin-right:auto;padding:0 8px 0 2px;border:0;background:none;border-radius:12px;color:var(--ink)}
.where{display:inline-flex;align-items:center;gap:6px;min-height:44px;max-width:56vw;padding:0 8px;border:0;background:none;border-radius:12px;font-size:16px;font-weight:600;letter-spacing:-.01em;min-width:0}
.where span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.where .ui{color:var(--ink3)}
.rb{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:12px;color:var(--ink)}
.rb:disabled{opacity:.3}
.rb:active,.where:active,.brand:active{background:var(--card2)}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:4px;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(12px,env(safe-area-inset-left,0px));background:var(--card);border-top:1px solid var(--line)}
#nav button{flex:1;max-width:170px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;border-radius:14px;font-size:12px;font-weight:500;color:var(--ink3)}
#nav button[aria-current]{color:var(--ink);font-weight:600;background:var(--card2)}
#nav button[aria-current] .ui{color:var(--brass-ink)}

/* colonne: un luogo, oppure più luoghi affiancati */
.cols{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:0 28px;align-items:start}
.col{min-width:0}
.col-h{display:flex;align-items:baseline;gap:8px;font-size:21px;font-weight:700;letter-spacing:-.01em;margin:2px 4px 8px;min-width:0}
.col-h b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.col-h small{font-size:13px;font-weight:400;color:var(--ink3);white-space:nowrap}

/* adesso */
.now{padding:2px 4px 0}
.now-meta{display:flex;align-items:center;justify-content:space-between;color:var(--ink3);font-size:14px}
.upd{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 8px;margin-right:-8px;border:0;background:none;border-radius:10px;color:var(--ink3);font-size:13px}
.rc{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:8px 4px 10px;border:0;background:none;border-radius:22px;text-align:center}
.rc:active{background:var(--card2)}
.rc-main{display:flex;align-items:center;justify-content:center;gap:14px;max-width:100%}
.rc-ic .wxi{stroke-width:1.3}
.rc-t{font-size:84px;font-weight:300;line-height:1;letter-spacing:-.055em}
.rc-side{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-left:14px;border-left:1px solid var(--line)}
.rc-side small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.rc-side b{font-size:38px;font-weight:500;line-height:1;letter-spacing:-.03em}
.rc-l{font-size:17px;font-weight:600;color:var(--ink)}
.rc-st{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rc-st span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.rc-st .ui{color:var(--ink3)}
.rc-more{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--brass-ink);margin-top:2px}
.say{font-size:25px;line-height:1.18;font-weight:600;letter-spacing:-.02em;margin-top:16px;text-wrap:balance}
.say2{font-size:16px;color:var(--ink2);margin-top:8px;text-wrap:pretty}
.tom{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;width:100%;margin-top:14px;padding:10px 12px 10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:14px;color:var(--ink2);text-align:left;font-variant-numeric:tabular-nums}
.tom b{font-weight:700;color:var(--ink)}.tom span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tom>.ui{margin-left:auto;color:var(--ink3)}.tom span .ui{color:var(--brass-ink)}
.tom:active{background:var(--card2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips.center{justify-content:center;margin:14px 0 4px}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:13px;white-space:nowrap}
button.chip{min-height:38px;font-size:14px}
button.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}

/* pulsanti piccoli che si aprono: allerta, attenzione, media del periodo */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pb{display:inline-flex;align-items:center;gap:6px;min-height:36px;max-width:100%;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:13px;font-weight:600;white-space:nowrap}
.pb span{overflow:hidden;text-overflow:ellipsis}
.pb .ui:last-child{opacity:.65}
.pb.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pb.na{border-style:dashed}
.pb.lev1{background:var(--y);border-color:var(--y);color:#0E1D2A}
.pb.lev2{background:var(--o);border-color:var(--o);color:#0E1D2A}
.pb.lev3{background:var(--r);border-color:var(--r);color:#fff}
.pb.pa,.pb.nm{background:var(--brass-soft);border-color:transparent;color:var(--brass-ink)}
.pb[aria-expanded="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink3)}
.pb.lev2 .ui:first-child,.pb.lev3 .ui:first-child{animation:beat 2.6s ease-in-out infinite}
.pan{margin-top:12px}
.pan .alert,.pan .calm,.pan .att{margin:0}
.reveal{animation:drop .28s ease}
.nm-c svg{width:100%;height:auto}
.nm-band{fill:var(--brass);opacity:.16}.nm-hi{fill:none;stroke:var(--brass);stroke-width:1.8}.nm-lo{fill:none;stroke:var(--rain);stroke-width:1.8}
.nm-dot{fill:var(--ink);stroke:var(--card);stroke-width:2}
.nm-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink3);margin:4px 0 10px}
.nm-leg span{display:inline-flex;align-items:center;gap:6px}.nm-leg i{display:block;width:14px;height:3px;border-radius:2px}
.nm-leg .l1{background:var(--brass)}.nm-leg .l2{background:var(--rain)}.nm-leg .l3{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.nm p{font-size:14px;line-height:1.5;color:var(--ink2)}.nm p+p{margin-top:8px}.nm p b{color:var(--ink)}

/* adesso, nel dettaglio */
.det{display:grid;gap:10px;margin-top:4px}
.dgp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.dgp h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:10px}.dgp h3 .ui{color:var(--brass-ink)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;font-variant-numeric:tabular-nums}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)}
.kv b{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.kv small{font-size:11px;color:var(--ink3);line-height:1.35}
.kv.k2{margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.det .btn{min-height:44px}
.arw{transition:transform .4s ease}

.h{display:flex;align-items:center;gap:8px;font-size:18px;letter-spacing:-.01em;color:var(--ink);font-weight:700;margin:28px 4px 10px}
.h .ui{color:var(--brass-ink)}
.h.big{font-size:20px;margin:26px 4px 12px}
.h-row{display:flex;align-items:flex-end;justify-content:space-between}
.link{min-height:44px;padding:0 6px;border:0;background:none;color:var(--brass-ink);font-size:14px;font-weight:600;margin-top:14px}
.lbl{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flush{padding:0;overflow:hidden}
.card.txt{font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:8px;margin-top:12px}
.card+.card{margin-top:12px}
.cap{font-size:12px;color:var(--ink3);padding:0 16px 12px}
.cap.c{text-align:center;padding:8px 0 0}
.foot{font-size:12px;color:var(--ink3);text-align:center;margin:26px 8px 0;line-height:1.55}
.foot.left{text-align:left;margin:14px 4px 0}

/* strisce: ore e giorni, con la legenda fissa a sinistra */
.strip{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;font-variant-numeric:tabular-nums}
.strip::-webkit-scrollbar{display:none}
.c{display:flex;align-items:center;justify-content:center;gap:3px;width:100%;font-size:12px;color:var(--ink2);white-space:nowrap}
.c em{font-style:normal}
.c.z,.c em.z{color:var(--ink3);opacity:.6;font-weight:400}
.c-h{height:26px;color:var(--ink3)}
.c-ic{height:32px}
.c-t{height:26px;font-size:16px;font-weight:600;color:var(--ink)}
.c-mm{height:42px;flex-direction:column;gap:2px;color:var(--rain);font-weight:700}
.bar{display:flex;align-items:flex-end;width:10px;height:18px;border-radius:5px;background:var(--card2)}
.bar i{display:block;width:10px;border-radius:5px;background:var(--rain)}
.c-pp{height:22px;color:var(--rain);font-weight:600}
.c-w{height:28px}
.c-uv{height:26px}
.c-aq{height:24px;gap:4px}
.lg{position:sticky;left:0;z-index:2;flex:0 0 64px;display:flex;flex-direction:column;padding:26px 0 8px;background:var(--card2);border-right:1px solid var(--line)}
.lg.d{padding-top:8px}
.lg .c{justify-content:flex-start;padding-left:10px;gap:4px;font-size:10px;font-weight:600;color:var(--ink2);flex-direction:row}
.lg .ui{color:var(--brass-ink)}
.lg .c-rng{flex-direction:column;align-items:flex-start;justify-content:center;gap:3px}
.dg{flex:none;border-left:1px dashed var(--line);padding-bottom:8px}
.lg+.dg{border-left:0}
.dg-l{height:26px}
.dg-l span{position:sticky;left:64px;display:inline-block;padding:7px 10px 0;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.dg-c{display:flex;padding:0 3px}
.hc{flex:0 0 48px;display:flex;flex-direction:column;align-items:center;border-radius:12px}
.hc.on,.dc.on{background:var(--card2)}
.hc.on .c-h{color:var(--ink);font-weight:700}
.hc.on .bar,.dc.on .bar{background:var(--line)}
.dc{flex:1 0 50px;display:flex;flex-direction:column;align-items:center;padding:8px 0;border:0;border-left:1px solid var(--line);background:none}
.lg+.dc{border-left:0}
.c-dn{height:38px;flex-direction:column;gap:0;color:var(--ink)}
.c-dn b{font-size:13px;font-weight:700}.c-dn small{font-size:12px;color:var(--ink3)}
.c-rng{position:relative;height:104px}
.dc .c-rng i{position:absolute;left:50%;width:8px;margin-left:-4px;border-radius:4px;background:linear-gradient(180deg,var(--brass),var(--rain))}
.dc .c-rng em{position:absolute;left:0;right:0;height:16px;line-height:16px;text-align:center;font-size:13px}
.dc .c-rng .hi{font-weight:700;color:var(--ink)}.dc .c-rng .lo{color:var(--ink3)}
.uv{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 4px;border-radius:6px;font-style:normal;font-size:12px;font-weight:700;color:#0E1D2A}
.uv0{background:#BFE3C0}.uv1{background:var(--y)}.uv2{background:var(--o)}.uv3{background:#D9534A;color:#fff}.uv4{background:#8E5BC9;color:#fff}
.aqd{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%}
.aq0{background:#4FB7A5}.aq1{background:#8CC56A}.aq2{background:var(--y)}.aq3{background:var(--o)}.aq4{background:var(--r)}.aq5{background:#7D2181}

.more{display:grid;grid-template-columns:24px 1fr 20px;align-items:center;column-gap:12px;width:100%;min-height:56px;padding:0 14px 0 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:14px;color:var(--ink2)}
.more .ui{color:var(--ink3)}
.dc:active,.more:active,.pg:active,.res-i:active,.pl-main:active,.fonti button:active{background:var(--card2)}
.pg,table,.stats,.pl-t{font-variant-numeric:tabular-nums}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)}.tile b{display:inline-flex;align-items:center;gap:6px;font-size:18px;font-weight:600;letter-spacing:-.01em}.tile small{font-size:12px;color:var(--ink3);min-height:17px}
.tiles.in .tile{background:var(--card2);border-color:transparent}

/* allerte: gli unici colori accesi */
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.lev1{background:var(--y)}.dot.lev2{background:var(--o)}.dot.lev3{background:var(--r)}.dot.lev0{background:transparent;border:2px solid var(--ink3)}
.alert{border-radius:20px;overflow:hidden;background:var(--card);border:1.5px solid var(--line);margin:8px 0 18px}
.alert-h{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:16px;letter-spacing:.01em}
.alert-h b{font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.alert-h span{margin-left:auto;font-weight:600;font-size:14px}
.alert.lev1{border-color:var(--y)}.alert.lev1 .alert-h{background:var(--y);color:#0E1D2A}
.alert.lev2{border-color:var(--o)}.alert.lev2 .alert-h{background:var(--o);color:#0E1D2A}
.alert.lev3{border-color:var(--r)}.alert.lev3 .alert-h{background:var(--r);color:#fff}
.alert-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.alert-b p{display:flex;gap:10px;font-size:15px;line-height:1.4}.alert-b p .dot{margin-top:6px}.alert-b p b{margin-right:4px}
.alert-b .alert-src{font-size:12px;color:var(--ink3);display:block}
.alert-a{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.alert-a a{flex:1 1 auto;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:12px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.alert-a a:first-child{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.calm{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink2);text-decoration:none;font-size:14px;line-height:1.35;margin-top:22px}
.calm span{flex:1;min-width:0}.calm small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.calm.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}.calm.ok small{color:var(--ok);font-weight:400;opacity:.9}
.calm .ui:last-child{opacity:.6}
.calm.lev1{background:var(--y-soft);border-color:var(--y);color:var(--y-ink);font-weight:600;align-items:flex-start}.calm.lev1 .dot{margin-top:5px;width:12px;height:12px}.calm.lev1 small{color:var(--y-ink);font-weight:400}.calm.lev1 small+small{opacity:.8}
.att{border-radius:16px;background:var(--brass-soft);padding:14px 16px;margin-top:12px;color:var(--ink)}
.att-h{display:flex;align-items:center;gap:8px;color:var(--brass-ink);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.att ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:500;line-height:1.35}
.att li{display:flex;align-items:flex-start;gap:8px}.att li .ui{color:var(--brass-ink);margin-top:1px}
.att p{font-size:12px;color:var(--ink3);margin-top:8px}
.warn{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px dashed var(--ink3);color:var(--ink2);font-size:13px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.off{background:var(--brass-soft);color:var(--brass-ink)}
.pill.lev1{background:var(--y-soft);color:var(--y-ink)}.pill.lev2{background:var(--o-soft);color:var(--o-ink)}.pill.lev3{background:var(--r-soft);color:var(--r-ink)}

/* un giorno */
.dv-say{font-size:20px;font-weight:600;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 6px}
.stats div{display:flex;flex-direction:column;gap:1px}.stats b{font-size:17px;font-weight:600;white-space:nowrap}.stats span{font-size:12px;color:var(--ink3)}
.chart{margin:8px -8px 0;touch-action:pan-y;cursor:crosshair;-webkit-user-select:none;user-select:none}
.chart svg{width:100%;height:auto}
.c-line{fill:none;stroke:var(--brass);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--brass);opacity:var(--area,.1)}.c-bar{fill:var(--rain)}.c-axis{stroke:var(--line);stroke-width:1}
.chart{--halo:var(--card)}.sh .chart{--halo:var(--bg)}
.c-txt,.c-val,.c-rain{paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.c-txt{fill:var(--ink3);font:500 11px var(--font)}.c-val{fill:var(--ink);font:600 12px var(--font)}.c-val.dim{fill:var(--ink3)}
.c-rain{fill:var(--rain);font:600 11px var(--font)}
.c-now{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}
.c-sel{stroke:var(--ink);stroke-width:1.2;opacity:.55}.c-selc{fill:var(--card);stroke:var(--ink);stroke-width:2}
.read{border-top:1px solid var(--line);padding-top:8px}
.read-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.read-h{display:flex;flex-direction:column;align-items:center;gap:2px}.read-h b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.read-h span{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2)}
.read .rb{background:var(--card2)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--ink2);padding:12px 0 0;margin-top:12px;border-top:1px solid var(--line)}
.note .ui{color:var(--brass-ink);margin-top:1px}.note .dot{margin-top:5px}.note b{color:var(--ink)}
.src{font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.5}
.state{padding:36px 12px;text-align:center;color:var(--ink2);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:16px}

/* passato */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin:4px 0 14px}
.seg button{min-height:42px;border:0;border-radius:12px;background:none;font-size:15px;font-weight:500;color:var(--ink2)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,29,42,.12)}
.seg.small{margin:0}
.pick{display:flex;flex-direction:column}
.pick-row{display:flex;align-items:center;gap:8px}
.pick-row .rb{background:var(--card2)}
select{min-height:48px;width:100%;min-width:0;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:16px;font-weight:500;-webkit-appearance:none;appearance:none}
.datef{position:relative;display:block;flex:1;min-width:0}
.datef-l{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden}
.datef-l span{overflow:hidden;text-overflow:ellipsis}.datef-l .ui{color:var(--ink3)}
.datef input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;border:0;padding:0;cursor:pointer;font-size:16px;-webkit-appearance:none;appearance:none}
.datef input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.datef:focus-within .datef-l{outline:2px solid var(--brass);outline-offset:2px}
.pick .chips{margin-top:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.thr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px;color:var(--ink2)}
.thr select{width:auto;min-width:104px;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.legend{display:flex;align-items:center;gap:14px;padding:12px 16px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend span:last-child{margin-left:auto}
.legend i,.pg-b i{display:block;height:8px;border-radius:3px}.legend i{width:16px}
.b1{background:var(--rain-soft)}.b2{background:var(--rain)}
.pg{display:grid;grid-template-columns:88px minmax(0,1fr) auto;align-items:center;column-gap:10px;width:100%;min-height:58px;padding:8px 14px 8px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.legend+.pg{border-top:0}
.pg-d{font-size:14px;font-weight:500}
.pg-b{display:flex;flex-direction:column;gap:5px}.pg-b>span{display:flex;align-items:center;gap:6px}.pg-b i{min-width:2px}.pg-b em{font-style:normal;font-size:11px;color:var(--ink3)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:600;color:var(--ink3);text-align:right;padding:12px 8px;white-space:nowrap;letter-spacing:.02em}
td{text-align:right;padding:11px 8px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:16px}th:last-child,td:last-child{padding-right:16px}
tr.wet td:nth-child(4){color:var(--rain);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border:1px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;text-decoration:none}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.wide{width:100%}.btn:disabled{opacity:.55}
.tiles+.card,.card+.two,.card+.tiles,.pick+.tiles{margin-top:12px}

/* luoghi */
.search{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink3);margin-top:4px}
.search input{flex:1;min-width:0;height:50px;border:0;background:none;outline:0;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.search:focus-within{border-color:var(--brass)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
#results{margin:10px 0}
.res-n{font-size:14px;color:var(--ink2);padding:6px 6px 2px}
.res-i{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--ink3)}
.res-i:first-child{border-top:0}
.res-i span{display:flex;flex-direction:column;min-width:0;color:var(--ink)}.res-i b{font-weight:600}.res-i small,.pl-n small{font-size:13px;color:var(--ink3)}
.places{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.pl.on{border-color:var(--ink)}
.pl-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:72px;padding:12px 16px;border:0;background:none;text-align:left}
.pl-n{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.pl-n b{font-size:17px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-n .pill{margin-top:6px}
.tag{font-style:normal;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--card2);color:var(--ink2);margin-top:2px}
.pl-t{font-size:26px;font-weight:400;letter-spacing:-.03em;min-width:48px;text-align:right}
.pl-ed{display:flex;align-items:center;border-left:1px solid var(--line);padding:0 4px}.pl-ed .del{color:var(--r)}
.welcome{display:flex;flex-direction:column;align-items:center;padding:14vh 4px 0;text-align:center}
.welcome .search,.welcome #results,.welcome .btn{width:100%;text-align:left}.welcome .btn{justify-content:center}
.w-logo{color:var(--ink);margin-bottom:10px}
.w-say{font-size:19px;color:var(--ink2);margin:14px 0 30px;text-wrap:balance}

/* fogli */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh-back{position:absolute;inset:0;background:rgba(6,14,20,.5);animation:fade .2s ease}
.sh{position:relative;width:100%;max-width:540px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 12px 10px 20px}
.sh-top h2{font-size:21px;font-weight:600;letter-spacing:-.01em}.sh-top p{font-size:13px;color:var(--ink3);margin-top:2px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(20px,env(safe-area-inset-left,0px))}
.set .lbl{margin:24px 0 10px}.set .lbl:first-child{margin-top:4px}
.set .p{font-size:14px;color:var(--ink2);line-height:1.5;margin-bottom:10px}
.fonti a{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px 10px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.fonti a:first-child{border-top:0}.fonti span{flex:1;min-width:0;display:flex;flex-direction:column}.fonti b{font-size:15px;font-weight:600}.fonti small{font-size:12px;color:var(--ink3);line-height:1.4}.fonti .ui{color:var(--ink3)}
.about{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:30px;font-size:13px;color:var(--ink3)}.about .wordmark{color:var(--ink)}.about b{color:var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px);z-index:30;transform:translate(-50%,16px);max-width:min(92vw,480px);padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.skel{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.sk{display:block;border-radius:16px;background:var(--card);animation:pulse 1.4s ease-in-out infinite}
.sk1{height:110px;width:55%}.sk2{height:64px}.sk3{height:140px}.sk4{height:56px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes float{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes rain{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
/* luoghi: stella, confronto */
.pl .st{align-self:center;margin-left:6px;color:var(--ink3)}
.pl .st.on{color:var(--brass)}.pl .st.on svg{fill:currentColor}
.pl .cm{align-self:center;margin-right:10px;border:1px solid var(--line)}
.pl .cm.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pl-main{padding-left:8px}
.cmpbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.4;color:var(--ink2);margin-bottom:12px}
.cmpbar>.ui{color:var(--brass-ink)}.cmpbar span{flex:1 1 220px;min-width:0}.cmpbar b{color:var(--ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}

/* guida e fonti */
.fonti button{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px 10px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.fonti button:first-child{border-top:0}.fonti button>.ui:first-child{color:var(--brass-ink)}
.sh-top .bk{display:inline-flex;align-items:center;gap:2px;min-height:32px;margin:0 0 4px -6px;padding:0 8px 0 2px;border:0;background:none;border-radius:8px;color:var(--brass-ink);font-size:13px;font-weight:600}
.gd{display:flex;flex-direction:column;gap:10px}
.gd dl{margin:0}.gd dt{font-size:15px;font-weight:700;margin-top:12px}.gd dt:first-child{margin-top:0}
.gd dd{margin:3px 0 0;font-size:14px;line-height:1.5;color:var(--ink2)}

@media (max-width:379px){.rc-t{font-size:68px}.rc-main{gap:10px}.rc-side{padding-left:10px}.rc-side b{font-size:32px}.say{font-size:23px}}

/* tablet e telefono in orizzontale */
@media (min-width:700px){
  #app{max-width:760px}
  #app.multi{max-width:1280px}
  #main{padding-top:8px}
  .sh{border-radius:24px;margin-bottom:4vh;max-height:88vh;max-width:620px}#sheet{align-items:center}
  .det{grid-template-columns:repeat(2,minmax(0,1fr))}
  .det>.btn{grid-column:1/-1}
  .multi .det{grid-template-columns:1fr}
  .multi .cols{gap:0 22px}
  .welcome{max-width:520px;margin:0 auto}
}
/* computer: le sezioni salgono in alto, Oggi si dispone su due colonne */
@media (min-width:900px){
  #app,#app.multi{max-width:1280px}
  #top{padding:calc(env(safe-area-inset-top,0px) + 12px) 22px 10px 28px}
  #main{padding:10px 28px 56px}
  #nav{top:calc(env(safe-area-inset-top,0px) + 12px);bottom:auto;left:50%;right:auto;transform:translateX(-50%);padding:0;background:none;border:0}
  #nav button{flex:none;max-width:none;flex-direction:row;gap:8px;min-height:44px;padding:0 16px;font-size:15px}
  #toast{bottom:24px}
  .where{max-width:30vw}
  .n1 .oggi{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:0 40px;align-items:start}
  .n1 .o-b>.h:first-child{margin-top:10px}
  .past.one,.tab-luoghi #main{width:100%;max-width:816px;margin-left:auto;margin-right:auto}
  .past-h{max-width:760px;margin:0 auto}
  .hc{flex-basis:52px}
}

/* stampa: solo il registro */
#print{display:none}
@media print{
  html,body{background:#fff!important;color:#000!important}
  #app,#sheet,#toast,#splash{display:none!important}
  #print{display:block;font:400 11pt/1.4 var(--font);color:#000;padding:0}
  #print h1{font-size:20pt;font-weight:600;margin:0 0 2pt}#print .p-sub{font-size:12pt;margin:0 0 12pt}
  #print p{margin:0 0 10pt}#print table{width:100%;font-size:10pt;margin-top:6pt}
  #print th{color:#000;font-size:9pt;border-bottom:1.2pt solid #000;padding:4pt 6pt}#print td{border-top:.5pt solid #bbb;padding:3.5pt 6pt}
  #print th:first-child,#print td:first-child{padding-left:0}#print tr.wet td:nth-child(4){color:#000;font-weight:700}
  #print td:nth-child(n+6),#print th:nth-child(n+6){text-align:left}
  #print .p-foot{font-size:8.5pt;color:#444;margin-top:12pt}
  thead{display:table-header-group}tr{break-inside:avoid}
  @page{margin:16mm 14mm}
}

/* ---------- 1.2: splash ---------- */
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 18vh) 24px calc(env(safe-area-inset-bottom,0px) + 30px);background:var(--bg);color:var(--ink);cursor:pointer;transition:opacity .45s ease,transform .45s ease;outline:0}
.nosplash #splash{display:none}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-c{display:flex;flex-direction:column;align-items:center;gap:18px}
.sp-o{overflow:visible;animation:spFloat 4.2s ease-in-out 1.5s infinite}
.sp-o-b{fill:var(--cloud-f);stroke:none;opacity:0;animation:spFill .8s ease 1s forwards}
.sp-o-p{fill:none;stroke:var(--ink);stroke-width:7;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw 1.3s cubic-bezier(.65,0,.35,1) .15s forwards}
.sp-w{opacity:0;animation:spUp .7s cubic-bezier(.16,1,.3,1) 1s forwards}
.sp-say{font-size:16px;color:var(--ink2);opacity:0;animation:spUp .7s cubic-bezier(.16,1,.3,1) 1.2s forwards}
.sp-f{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink3);opacity:0;animation:spUp .6s ease 1.5s forwards}
.sp-go{font-size:15px;font-weight:600;color:var(--brass-ink);margin-bottom:10px;animation:spBlink 2.2s ease-in-out 2.2s infinite}
.sp-v i{font-style:normal}.sp-by b{color:var(--ink);font-weight:700}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFill{to{opacity:1}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spBlink{0%,100%{opacity:1}50%{opacity:.35}}
.w-o{overflow:visible;animation:spFloat 4.2s ease-in-out infinite}.w-o path{fill:var(--cloud-f);stroke:var(--ink);stroke-width:7;stroke-linejoin:round}

/* ---------- 1.2: icone animate ---------- */
.anim .i-rays{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.anim .i-rays.p{transform-box:view-box;transform-origin:9px 9px;animation:rayPulse 3.2s ease-in-out infinite}
@keyframes rayPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.75}}
.anim .i-disk{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.anim .i-cl{animation:drift 5.5s ease-in-out infinite alternate}
.anim .i-cl.bk{animation:drift2 7s ease-in-out infinite alternate}
.anim .i-rn{animation:fall 1.15s linear infinite}
.anim .i-sn{animation:snow 2.6s linear infinite}
.anim .d2{animation-delay:-.38s}.anim .d3{animation-delay:-.76s}.anim .d4{animation-delay:-.2s}
.anim .i-sn.d2{animation-delay:-.9s}.anim .i-sn.d3{animation-delay:-1.7s}
.anim .i-bolt{animation:flash 3.4s ease-in-out infinite}
.anim .i-fog{animation:fog 4s ease-in-out infinite alternate}.anim .i-fog.d2{animation-delay:-1.3s;animation-direction:alternate-reverse}.anim .i-fog.d3{animation-delay:-2.6s}
.anim .i-moon{transform-box:fill-box;transform-origin:center;animation:rock 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes drift{from{transform:translateX(-.9px)}to{transform:translateX(.9px)}}
@keyframes drift2{from{transform:translateX(.8px)}to{transform:translateX(-.8px)}}
@keyframes fall{0%{transform:translate(.5px,-2px);opacity:0}25%{opacity:1}80%{opacity:1}100%{transform:translate(-.6px,2.4px);opacity:0}}
@keyframes snow{0%{transform:translate(0,-1.8px);opacity:0}20%{opacity:1}50%{transform:translate(.7px,.4px)}85%{opacity:1}100%{transform:translate(-.4px,2.4px);opacity:0}}
@keyframes flash{0%,100%{opacity:.45}4%{opacity:1}7%{opacity:.45}10%{opacity:1}16%{opacity:.45}}
@keyframes fog{from{transform:translateX(-1.4px)}to{transform:translateX(1.4px)}}
@keyframes rock{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(5deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ---------- 1.2: movimento dell'interfaccia ---------- */
#main.enter .col>*,#main.enter .oggi>div>*,#main.enter .past-h>*,#main.enter .past>.cols,#main.enter>.welcome,#main.enter .h-row,#main.enter .places>*,#main.enter .search{animation:enter .5s cubic-bezier(.16,1,.3,1) both}
#main.enter .o-a>*:nth-child(2),#main.enter .places>*:nth-child(2){animation-delay:.05s}
#main.enter .o-b>*:nth-child(1),#main.enter .places>*:nth-child(3){animation-delay:.08s}
#main.enter .o-b>*:nth-child(2),#main.enter .places>*:nth-child(4){animation-delay:.12s}
#main.enter .o-b>*:nth-child(3){animation-delay:.16s}#main.enter .o-b>*:nth-child(n+4){animation-delay:.2s}
.reveal{animation:drop .38s cubic-bezier(.16,1,.3,1)}
.sh-back{animation:fade .25s ease}
.sh{animation:up .42s cubic-bezier(.16,1,.3,1)}
.pb,.chip,.btn,.tom,.dc,.rb,.ib,#nav button,.seg button{transition:transform .15s ease,background-color .2s ease,box-shadow .2s ease,color .2s ease}
.pb:active,.chip:active,.btn:active,.tom:active,.ib:active,#nav button:active{transform:scale(.96)}
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
.draw .c-line,.draw .dl-hi,.draw .dl-lo{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.65,0,.35,1) .1s forwards}
.draw .c-area{animation:areaIn .9s ease .4s both}
@keyframes areaIn{from{opacity:0}}
.draw .c-bar{transform-box:fill-box;transform-origin:bottom;animation:grow .55s cubic-bezier(.16,1,.3,1) .35s both}
.draw .dl-pt,.draw .dl-v{animation:areaIn .5s ease .8s both}
.rc-t{transition:color .3s}

/* ---------- 1.2: info ---------- */
.ib{display:inline-flex;align-items:center;justify-content:center;flex:none;width:22px;height:22px;margin:-4px 0;padding:0;border:0;border-radius:50%;background:none;color:var(--ink3);vertical-align:middle}
.ib svg{width:16px;height:16px}
.ib:hover{color:var(--brass-ink);background:var(--card2)}
.h .ib{margin-left:-2px}
#tip{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.tip-back{position:absolute;inset:0;background:rgba(6,14,20,.35);animation:fade .2s ease}
.tip{position:relative;width:100%;max-width:440px;max-height:80vh;overflow-y:auto;padding:16px 16px 14px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 18px 50px -20px rgba(6,14,20,.45);animation:pop .3s cubic-bezier(.16,1,.3,1)}
.tip-h{display:flex;align-items:flex-start;gap:8px}.tip-h h3{flex:1;font-size:17px;font-weight:700;padding-top:9px}
.tip-v{display:inline-flex;align-items:center;gap:8px;margin:2px 0 6px;padding:4px 10px;border-radius:10px;background:var(--card2);font-size:14px;font-weight:600}
.tip p{font-size:14px;line-height:1.5;color:var(--ink2);margin-top:8px}.tip p b{color:var(--ink)}
.tip .btn{margin-top:14px;min-height:44px}
@media (min-width:700px){#tip{align-items:center}}

/* ---------- 1.2: pulsanti su una riga ---------- */
.pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px;margin-left:-2px;margin-right:-2px}
.pills::-webkit-scrollbar{display:none}
.pills .pb{flex:1 1 0;min-width:0;justify-content:center;padding:0 10px;gap:5px}
.pills .pb span{min-width:0}
.reg-a{margin-top:10px}.reg-a a:first-child{background:none;color:var(--ink);border-color:var(--line)}.reg-a a:last-child{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- 1.2: intestazioni fisse dei luoghi affiancati ---------- */
.col-h{position:sticky;top:var(--toph);z-index:4;margin:0 -4px 8px;padding:6px 8px 8px;background:var(--bg);border-bottom:1px solid var(--line);align-items:center}
.col-h .ch-n{display:flex;flex-direction:column;min-width:0;flex:1}
.col-h .ch-n b{font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-h .ch-n small{font-size:12px}
.col-h .ch-w{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.col-h .ch-w strong{font-size:22px;font-weight:600;color:var(--ink)}
.foot.one{margin-top:30px}

/* ---------- 1.2: strisce ---------- */
.c-rh{height:22px;color:var(--ink2)}
.c-cf{height:22px;font-weight:600}
.cf3{color:var(--ok)}.cf2{color:var(--ink2)}.cf1{color:var(--brass-ink)}.cf0{color:var(--o-ink)}
.dwrap{position:relative;display:flex}
.dwrap .dc{flex:0 0 var(--dw,56px)}
.dl{position:absolute;left:0;top:78px;pointer-events:none;overflow:visible}
.dl-g{stroke:var(--grid);stroke-width:1}
.dl-hi{fill:none;stroke:var(--brass);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.dl-lo{fill:none;stroke:var(--rain);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.dl-pt{stroke:var(--card);stroke-width:2}.dl-pt.hi{fill:var(--brass)}.dl-pt.lo{fill:var(--rain)}
.dl-v{font:600 12px var(--font);text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}.dl-v.hi{fill:var(--ink)}.dl-v.lo{fill:var(--ink3);font-weight:500}
.dc.on .dl-v{stroke:var(--card2)}
.lg .c-rng{position:relative}
.lg .c-rng .gl{position:absolute;left:10px;font-size:10px;font-weight:500;color:var(--ink3);transform:translateY(-50%)}
.lg .c-rng .gh{position:absolute;left:24px;top:4px;display:flex;flex-direction:column;gap:2px}
.lg .c-rng .gh i{display:flex;align-items:center;gap:4px;font-style:normal;font-size:10px}.lg .c-rng .gh i:before{content:"";width:10px;height:3px;border-radius:2px;background:var(--brass)}.lg .c-rng .gh i+i:before{background:var(--rain)}
.c-grid{stroke:var(--grid);stroke-width:1}
.c-gl{fill:var(--ink3);font:500 10px var(--font)}
.c-ic .wxi,.c-icg{pointer-events:none}

/* ---------- 1.2: passato ---------- */
.past-h,.past.one>.cols{width:100%}
.past .pick{gap:0}
.past .tiles{margin-top:12px}
.past .card+.tiles,.past .tiles+.card{margin-top:12px}
.tile .thr2{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--ink3)}
.tile .thr2 select{min-height:30px;width:auto;padding:0 24px 0 8px;font-size:13px;border-radius:8px;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.exp{display:flex;align-items:center;gap:10px;margin-top:12px}.exp .btn{flex:1}
.sum-h{display:flex;align-items:flex-start;gap:8px}.sum-h .dv-say{flex:1}
.dv-top{display:flex;align-items:flex-start;gap:8px}.dv-top .dv-say{flex:1}
.cf-b{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 10px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600}
@media (min-width:900px){
  .past.one,.past-h{max-width:816px}
  .past-h{margin:0 auto}
  .past:not(.one) .past-h{max-width:none}
  .past:not(.one) .past-h .pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 18px;align-items:end}
  .past:not(.one) .past-h .pick .chips{margin-top:0}
}

/* ---------- 1.2: guida ---------- */
.gd dt{scroll-margin-top:16px}
.gd .ge{padding:10px 0;border-top:1px solid var(--line)}.gd .ge:first-of-type{border-top:0;padding-top:0}
.gd .ge h4{font-size:15px;font-weight:700;margin:0 0 4px}
.gd .ge p{font-size:14px;line-height:1.5;color:var(--ink2);margin:4px 0 0}.gd .ge p b{color:var(--ink);font-weight:600}
.gd .ge.hl{animation:hl 2.2s ease}
@keyframes hl{0%,30%{background:var(--brass-soft)}100%{background:transparent}}
#nav .wxi{stroke-width:1.6}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.sp-o-p{stroke-dashoffset:0}.sp-o-b,.sp-w,.sp-say,.sp-f{opacity:1}}
</style>

}

/* ---------- info: cosa indica un dato, cosa comporta, come leggere il valore mostrato ---------- */
/* Ogni voce: t titolo, w cosa indica, c cosa comporta, r valori di riferimento, v(valore, contesto) lettura del valore mostrato */
function band(v, cuts, txts) { for (var i = 0; i < cuts.length; i++) if (v < cuts[i]) return txts[i]; return txts[cuts.length]; }
var INFO = {
  allerta: { t: 'Allerta', w: 'L\'allerta ufficiale per rischio idraulico (piene dei fiumi maggiori), idrogeologico (frane, piene di torrenti) e temporali. La decidono le Regioni; nembo la legge dal bollettino di criticità nazionale del Dipartimento della Protezione Civile, per oggi e domani.', c: 'Gialla: fenomeni localizzati, possibili danni puntuali. Arancione: fenomeni diffusi, possibili danni a edifici e infrastrutture. Rossa: fenomeni estesi e intensi, pericolo per le persone. Segui sempre le indicazioni del tuo Comune.', r: 'Il bollettino nazionale esce di norma tra le 13:30 e le 15:45 e arriva in nembo 15-45 minuti dopo. Le Regioni possono pubblicare sui loro siti un po\' prima e aggiornare in serata: nel pannello dell\'allerta trovi il collegamento al sito della tua Regione.' },
  zona: { t: 'Zona di allerta', w: 'L\'Italia è divisa in zone con clima e bacini simili. L\'allerta vale per la zona intera, non per il singolo comune.', c: 'Un\'allerta nella tua zona non vuol dire che il fenomeno colpirà proprio il tuo comune, ma che lì è possibile.', r: 'nembo trova la zona dalle coordinate del luogo e la ricontrolla ogni 30 giorni.' },
  attenzione: { t: 'Attenzione', w: 'Un avviso calcolato da nembo sui modelli meteo, non un\'allerta ufficiale.', c: 'Segnala nelle prossime 48 ore raffiche da burrasca, rovesci intensi, pioggia abbondante, caldo intenso, gelo, neve o temporali. Non sostituisce le indicazioni delle autorità.', r: 'Soglie: raffiche da 62 km/h (forza 8) e da 89 km/h (forza 10); oltre 10 mm in un\'ora (30 per il nubifragio); oltre 50 mm in un giorno; massime da 35°; minime sotto zero (sotto -10° dove il gelo è normale); neve da 1 cm.' },
  media: { t: 'Media del periodo', w: 'La normale climatica: la temperatura massima tipica di questi giorni dell\'anno nel trentennio 1991-2020, il riferimento dell\'Organizzazione Meteorologica Mondiale. nembo la ricava dalla rianalisi Copernicus ERA5 per il punto scelto, come media dei 15 giorni attorno alla data.', c: 'Dice se la giornata è anomala per la stagione: uno scarto ampio e prolungato pesa su colture, consumi di energia e salute più del valore assoluto.', r: 'Fino a 1,5° di scarto: nella media. Da 2 a 4°: un po\' fuori media. Da 5° in su: anomalia marcata.', v: function (d) { var a = Math.abs(d); return a < 1.5 ? 'Nella media: nulla di insolito per la stagione.' : a < 5 ? (d > 0 ? 'Più caldo del solito, ma senza eccessi.' : 'Più fresco del solito, ma senza eccessi.') : (d > 0 ? 'Anomalia calda marcata per la stagione.' : 'Anomalia fredda marcata per la stagione.'); } },
  temp: { t: 'Temperatura dell\'aria', w: 'La temperatura a 2 metri dal suolo, all\'ombra: è quella "a bulbo asciutto".', c: 'Decide come vestirsi e, insieme a umidità e vento, quanto il corpo fatica a mantenere i suoi 37°.', r: 'Sotto 0°: gelo. Da 0 a 10°: freddo. Da 10 a 18°: fresco. Da 18 a 25°: mite. Da 25 a 30°: caldo. Da 30 a 35°: molto caldo. Da 35°: caldo intenso.', v: function (t) { return band(t, [0, 10, 18, 25, 30, 35], ['Gelo: ghiaccio possibile su strade e piante.', 'Freddo: servono giacca e strati.', 'Fresco: una felpa o una giacca leggera.', 'Mite: temperatura gradevole.', 'Caldo: bevi regolarmente.', 'Molto caldo: evita sforzi nelle ore centrali.', 'Caldo intenso: rischio per anziani, bambini e malati.']); } },
  perc: { t: 'Temperatura percepita', w: 'Stima di come il corpo sente l\'aria: unisce temperatura, umidità, vento e sole.', c: 'Il vento porta via calore e fa sentire più freddo; l\'umidità alta frena il sudore e fa sentire più caldo. È il valore giusto per scegliere come vestirsi.', r: 'Stessa scala della temperatura. Uno scarto di oltre 3° dall\'aria vuol dire che vento o umidità contano molto.', v: function (t) { return INFO.temp.v(t); } },
  umid: { t: 'Umidità relativa', w: 'Quanto vapore c\'è nell\'aria rispetto al massimo che potrebbe contenere a quella temperatura, in percentuale. Al 100% l\'aria è satura.', c: 'Con il caldo un\'umidità alta dà afa, con il freddo rende l\'aria più pungente. Molto bassa secca pelle e mucose; molto alta rallenta l\'asciugatura e favorisce nebbia, condensa e muffe.', r: 'Sotto 30%: aria secca. Da 30 a 60%: confortevole. Da 60 a 80%: umida. Oltre 80%: molto umida.', v: function (h) { return band(h, [30, 60, 80], ['Aria secca: pelle e gola si seccano, elettricità statica.', 'Confortevole.', 'Aria umida: con il caldo si sente afa, i panni asciugano piano.', 'Molto umida: possibili nebbia e condensa, asciugatura lenta.']); } },
  rugiada: { t: 'Punto di rugiada', w: 'La temperatura a cui bisognerebbe raffreddare l\'aria perché il vapore condensi in rugiada o nebbia. Calcolato sul dispositivo con la formula di Magnus.', c: 'Misura la quantità vera di vapore, indipendente dalla temperatura: è il miglior indice dell\'afa. Più è vicino alla temperatura dell\'aria, più sono probabili nebbia e condensa.', r: 'Sotto 10°: aria secca. Da 10 a 16°: confortevole. Da 16 a 18°: un po\' umida. Da 18 a 21°: afosa. Da 21 a 24°: molto afosa. Oltre 24°: opprimente.', v: function (t) { return band(t, [10, 16, 18, 21, 24], ['Aria secca.', 'Confortevole.', 'Un po\' umida.', 'Afosa.', 'Molto afosa.', 'Opprimente.']); } },
  bulbo: { t: 'Temperatura a bulbo umido', w: 'La più bassa temperatura che l\'aria può raggiungere raffreddandosi per sola evaporazione: la segna un termometro avvolto in una garza bagnata. Stimata con la formula di Stull (2011).', c: 'Dice quanto il sudore riesce a raffreddare il corpo: più è alta, più il caldo è pericoloso, soprattutto sotto sforzo.', r: 'Sotto 21°: nessun problema. Da 21 a 26°: sforzo più faticoso. Da 26 a 31°: rischio di stress da calore. Da 31°: pericoloso anche a riposo, per chi non è abituato.', v: function (t) { return band(t, [21, 26, 31], ['Nessun problema per il corpo.', 'Sforzi fisici più faticosi del solito.', 'Rischio di stress da calore: pause e acqua.', 'Pericoloso: evita sforzi e cerca il fresco.']); } },
  vento: { t: 'Vento', w: 'La velocità media dell\'aria a 10 metri dal suolo. La direzione è quella da cui arriva: un vento da nord soffia verso sud; la freccia indica verso dove soffia.', c: 'Raffredda la percezione del freddo, solleva onde, asciuga il terreno. Oltre i 40 km/h dà fastidio a piedi e in bicicletta.', r: 'Scala Beaufort: fino a 11 km/h brezza leggera; da 20 a 38 vento moderato o teso; da 39 a 61 vento fresco o forte; da 62 burrasca; da 89 tempesta.', v: function (k) { var b = beaufort(k); return 'Forza ' + b + ' Beaufort, ' + BFT[b] + '. ' + band(k, [12, 29, 50, 62], ['Quasi non si sente.', 'Si sente, muove foglie e bandiere.', 'Fastidioso: ombrelli difficili, polvere.', 'Forte: rami che si piegano, cammino faticoso.', 'Burrasca: pericolo di rami e oggetti che cadono.']); } },
  raffica: { t: 'Raffica', w: 'Il picco di velocità del vento di pochi secondi.', c: 'È la raffica, non il vento medio, a spezzare rami e a far volare oggetti: conta per alberi, tende, ponteggi e moto.', r: 'Sotto 40 km/h: nessun problema. Da 40 a 62: fastidiose. Da 62 a 89: burrasca, rami spezzati. Da 89: tempesta, danni possibili.', v: function (k) { return band(k, [40, 62, 89], ['Nessun problema.', 'Fastidiose: fissa ciò che sta sul balcone.', 'Da burrasca: evita parchi e viali alberati.', 'Da tempesta: danni possibili, meglio restare al riparo.']); } },
  pressione: { t: 'Pressione', w: 'Il peso dell\'aria sopra di noi, in ettopascal, ricalcolato al livello del mare per confrontare luoghi a quote diverse. Il valore medio è circa 1013 hPa.', c: 'Pressione alta: tempo stabile, sereno (o nebbia d\'inverno). Bassa: tempo perturbato. Più della cifra conta la tendenza: un calo rapido annuncia peggioramento.', r: 'Sotto 1000 hPa: bassa. Da 1000 a 1010: tendente al basso. Da 1010 a 1020: normale. Oltre 1020: alta.', v: function (p) { return band(p, [1000, 1010, 1020], ['Bassa: tempo perturbato.', 'Un po\' bassa: tempo variabile.', 'Normale.', 'Alta: tempo stabile.']); } },
  psuolo: { t: 'Pressione al suolo', w: 'La pressione reale alla quota del luogo, non ricalcolata al livello del mare.', c: 'È quella che sente un altimetro o un barometro di casa non tarato: cala di circa 1 hPa ogni 8 metri di salita.', r: 'Al livello del mare coincide con la pressione; a 1000 m è circa 115 hPa più bassa.' },
  nuvole: { t: 'Nuvolosità', w: 'La parte di cielo coperta da nubi, in percentuale.', c: 'Più nubi: meno sole e UV di giorno, notti meno fredde.', r: 'Fino a 10%: sereno. Fino a 40%: poco nuvoloso. Fino a 70%: nuvoloso. Fino a 90%: molto nuvoloso. Oltre: coperto.', v: function (c) { return band(c, [10, 40, 70, 90], ['Sereno.', 'Poco nuvoloso.', 'Nuvoloso.', 'Molto nuvoloso.', 'Coperto.']); } },
  visib: { t: 'Visibilità', w: 'La distanza massima a cui si distingue un oggetto in orizzontale.', c: 'Sotto il chilometro si guida con prudenza e luci accese.', r: 'Sotto 1 km: nebbia. Da 1 a 4 km: foschia. Da 4 a 10 km: discreta. Oltre 10 km: buona.', v: function (m) { return band(m / 1000, [1, 4, 10], ['Nebbia: guida con molta prudenza.', 'Foschia.', 'Discreta.', 'Buona.']); } },
  cape: { t: 'CAPE', w: 'Energia disponibile per la convezione, in joule per chilogrammo: quanta spinta ha l\'aria calda per salire e formare nubi temporalesche.', c: 'Da sola non basta, serve un innesco; ma con valori alti i temporali, se partono, possono portare grandine e raffiche.', r: 'Sotto 300: aria stabile. Fino a 1000: instabilità debole. Fino a 2500: moderata. Oltre: forte.', v: function (c) { return band(c, [300, 1000, 2500], ['Aria stabile: temporali improbabili.', 'Instabilità debole.', 'Instabilità moderata: temporali possibili.', 'Instabilità forte: temporali anche intensi.']); } },
  zero: { t: 'Zero termico', w: 'La quota, in metri, a cui la temperatura dell\'aria libera scende a 0 gradi.', c: 'La neve arriva di solito fino a 300-500 metri sotto lo zero termico. In montagna dice se si cammina su neve dura o molle.', r: 'Sotto 1000 m: neve possibile in collina. Da 1000 a 2000 m: neve in montagna. Oltre 3000 m: gelo solo in alta quota.', v: function (m) { return band(m, [1000, 2000, 3000], ['Neve possibile fino in collina.', 'Neve in montagna.', 'Neve solo in alta montagna.', 'Gelo solo sulle vette.']); } },
  vpd: { t: 'Deficit di pressione di vapore', w: 'La differenza, in kilopascal, tra il vapore che l\'aria potrebbe contenere e quello che contiene.', c: 'Più è alto, più l\'aria "ha sete": panni, suolo e piante perdono acqua in fretta. Molto basso favorisce muffe e malattie delle piante.', r: 'Sotto 0,4: aria quasi satura. Da 0,4 a 1,2: equilibrato. Da 1,2 a 2: secco. Oltre 2: molto secco.', v: function (k) { return band(k, [0.4, 1.2, 2], ['Aria quasi satura: asciugatura lenta.', 'Equilibrato, buono per le piante.', 'Secco: le piante bevono di più.', 'Molto secco: stress idrico.']); } },
  rad: { t: 'Radiazione solare', w: 'La potenza del sole che arriva su una superficie orizzontale, in watt per metro quadrato.', c: 'Scalda superfici e corpo, fa rendere i pannelli fotovoltaici e asciugare il terreno.', r: 'Sotto 100: debole. Da 100 a 400: moderata. Da 400 a 700: forte. Oltre 700: sole pieno estivo.', v: function (w) { return band(w, [100, 400, 700], ['Debole.', 'Moderata.', 'Forte.', 'Molto forte.']); } },
  uv: { t: 'Indice UV', w: 'L\'intensità dei raggi ultravioletti che arrossano la pelle, secondo la scala dell\'Organizzazione Mondiale della Sanità.', c: 'Da 3 in su conviene proteggersi: crema, occhiali, cappello. Il rischio è più alto in montagna, al mare e sulla neve.', r: 'Fino a 2: basso. Da 3 a 5: moderato. 6 e 7: alto. Da 8 a 10: molto alto. Da 11: estremo.', v: function (u) { return ['Basso: nessuna protezione necessaria.', 'Moderato: crema e occhiali nelle ore centrali.', 'Alto: proteggiti e cerca l\'ombra a mezzogiorno.', 'Molto alto: evita il sole tra le 11 e le 16.', 'Estremo: evita il sole diretto.'][uvK(u)]; } },

/* ---------- viste ---------- */
function nowISO(d) { return new Date(Date.now() + (d.utc_offset_seconds || 0) * 1000).toISOString().slice(0, 16); }
function devToday() { var n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()); }
function placeToday(p) { var f = fcOf(p); return f ? nowISO(f.d).slice(0, 10) : devToday(); }
function isIt(p) { return p.cc ? /^(IT|SM|VA)$/.test(p.cc) : !!p.here; }
function hhmm(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function updatedTxt(at) {
  var d = new Date(at), n = new Date(), ieri = new Date(n.getTime() - 864e5);
  return (d.toDateString() === n.toDateString() ? '' : d.toDateString() === ieri.toDateString() ? 'ieri ' : d.getDate() + ' ' + MESI3[d.getMonth()] + ' ') + hhmm(at);
}
function joinE(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1]; }
function placeSub(p) { return [p.admin, p.country].filter(Boolean).join(', '); }
function shiftMonths(iso, n) {
  var y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1 + n, g = +iso.slice(8, 10);
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  var last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return y + '-' + pad(m + 1) + '-' + pad(Math.min(g, last));
}
/* Campo data: si vede la data in italiano, sotto c'è il selettore del telefono */
function dateField(id, value, min, max, style) {
  return `<span class="datef"><span class="datef-l">${ic('calendario', 18)}<span>${validDate(value) ? fmtDay(value, style || 'anno') : 'Scegli'}</span></span><input id="${id}" type="date" min="${min}" max="${max}" value="${esc(value)}" aria-label="${esc(validDate(value) ? fmtDay(value, 'anno') : 'Scegli una data')}"></span>`;
}
function errTxt(e) {
  if (e && e.net) return 'Sembra che tu sia offline, oppure il servizio non è raggiungibile.';
  if (e && e.status === 429) return 'Troppe richieste in poco tempo. Riprova tra un minuto.';
  return 'Il servizio meteo non risponde come previsto.';
}
function errorBox(e, action) {

}
function skeleton() {
  return '<div class="skel" aria-label="Carico il meteo"><i class="sk sk1"></i><i class="sk sk2"></i><i class="sk sk3"></i><i class="sk sk4"></i><i class="sk sk4"></i></div>';
}

/* Valori di adesso: quelli "correnti" se appena scaricati, altrimenti l'ora in corso */
function nowVals(f) {
  var d = f.d, H = hours(d), iso = nowISO(d), i0 = H.time.indexOf(iso.slice(0, 13) + ':00');
  if (i0 < 0 || !isNum(H.t[i0])) return null;
  var c = (Date.now() - f.at < 30 * 6e4 && d.current && isNum(d.current.temperature_2m)) ? d.current : null;
  function v(k, arr) { return c && isNum(c[k]) ? c[k] : arr[i0]; }
  return { H: H, i0: i0, today: iso.slice(0, 10), hour: +iso.slice(11, 13), t: v('temperature_2m', H.t), at: v('apparent_temperature', H.at), code: v('weather_code', H.code), isDay: v('is_day', H.day), w: v('wind_speed_10m', H.w), g: v('wind_gusts_10m', H.g), wd: v('wind_direction_10m', H.wd), rh: v('relative_humidity_2m', H.rh), pr: v('pressure_msl', H.pr), uv: H.uv[i0], cc: H.cc[i0], vis: H.vis[i0], sp: H.sp[i0], cape: H.cape[i0], fl: H.fl[i0], vpd: H.vpd[i0], sw: H.sw[i0] };
}

/* --- allerte --- */
function levTxt(l) {
  var parts = [];
  [3, 2, 1].forEach(function (lv) {
    var t = riskTxt(l, lv);
    if (t) parts.push(cap(LIVELLI[lv]) + ' per ' + t);
  });
  return parts.join('. ') + '.';
}
/* "rischio idraulico, idrogeologico e temporali" per i rischi a quel livello (o a qualsiasi livello) */
function riskTxt(l, lv) {
  var rs = ['idraulico', 'idrogeologico'].filter(function (r) { return lv ? l[r] === lv : l[r] > 0; });
  if (rs.length) rs[0] = 'rischio ' + rs[0];
  if (lv ? l.temporali === lv : l.temporali > 0) rs.push('temporali');
  return joinE(rs);
}
function alertOf(p, today) {
  if (!isIt(p) || !p.zone || !M.dpc) return null;
  var a = dpcFor(M.dpc, p.zone, today), b = dpcFor(M.dpc, p.zone, addDays(today, 1));
  if (!a && !b) return null;
  var mx = Math.max(a ? a.max : 0, b ? b.max : 0);
  return { a: a, b: b, max: mx, quando: mx && a && b && a.max === mx && b.max === mx ? 'oggi e domani' : (a && a.max === mx) ? 'oggi' : 'domani' };
}
/* Pulsante piccolo e colorato, che si apre sul suo pannello */
function pillBtn(k, cls, icon, txt) {

  return `<button class="pb ${cls}" data-a="tog" data-k="${k}" aria-expanded="${open}">${ic(icon, 17)}<span>${txt}</span>${ic(open ? 'su' : 'giu', 14)}</button>`;
}
function panel(k, html) { return V.open[k] && html ? `<div class="pan${V.just === k ? ' reveal' : ''}">${html}</div>` : ''; }
/* Collegamento al sito delle allerte della Regione del luogo: c'è in ogni pannello dell'allerta */
function regAnchor(p) {
  var reg = regionLink(p);
  return reg ? `<a href="${reg[2]}" target="_blank" rel="noopener">${esc(reg[1])}</a>` : `<a href="${LINK.centri}" target="_blank" rel="noopener">Centri funzionali regionali</a>`;
}
function regLinks(p) { return `<div class="alert-a reg-a"><a href="${LINK.bollettino}" target="_blank" rel="noopener">Bollettino nazionale</a>${regAnchor(p)}</div>`; }
function alertUI(p, today) {
  if (!isIt(p)) return null;

  if (!al) {
    if (p.zoneAt && !p.zone) return null;
    return { pill: pillBtn('al', 'na', 'scudo', 'Allerte n.d.'), panel: `<div class="calm">${ic('scudo', 20)}<span>Allerte non disponibili in questo momento.</span></div>${regLinks(p)}` };
  }
  var src = `${esc(zoneShort(p.zone))} - bollettino del ${fmtDay(M.dpc.date, 'mese')}, ore ${M.dpc.time}`;
  var regA = regAnchor(p);

    var giorni = al.a && al.b ? 'oggi e domani' : al.a ? 'oggi' : 'domani';
    var attesa = al.a && !al.b ? ' Domani: bollettino atteso nel pomeriggio.' : '';
    return { pill: pillBtn('al', 'ok', 'scudook', 'Nessuna allerta'), panel: `<div class="calm ok">${ic('scudook', 20)}<span>Nessuna allerta ${giorni}.<small>${src}.${attesa}</small></span>${ib('allerta')}</div>${regLinks(p)}` };
  }
  function riga(nome, l) {
    if (!l) return `<p><i class="dot lev0"></i><span><b>${nome}</b> Bollettino non ancora uscito.</span></p>`;
    return `<p><i class="dot lev${l.max}"></i><span><b>${nome}</b> ${l.max ? levTxt(l) : 'Nessuna allerta.'}</span></p>`;
  }
  return {
    pill: pillBtn('al', 'lev' + al.max, 'triangolo', 'Allerta ' + LIVELLI[al.max]),
    panel: `<section class="alert lev${al.max}" aria-label="Allerta ufficiale della Protezione Civile">
    <div class="alert-h">${ic('triangolo', 22)}<b>Allerta ${LIVELLI[al.max]}</b><span>${al.quando}</span></div>
    <div class="alert-b">${riga('Oggi', al.a)}${riga('Domani', al.b)}
      <p class="alert-src"><span>${src}</span>${ib('zona')}${ib('allerta')}</p>
      <div class="alert-a"><a href="${LINK.bollettino}" target="_blank" rel="noopener">Bollettino ufficiale</a><a href="${LINK.cosaFare}" target="_blank" rel="noopener">Cosa fare</a>${regA}</div>
    </div></section>`
  };
}
var ATT_IC = { vento: 'vento', pioggia: 'ampolla', neve: 'nuvola', caldo: 'termometro', gelo: 'termometro', temporale: 'triangolo' };

/* --- Oggi --- */
function tRange(a, b) {
  var x = Math.round(tVal(a)), y = Math.round(tVal(b));
  return (x < 0 || y < 0 ? x + ' / ' + y : x + '-' + y) + ' °' + UNITS.temp;
}
/* Freccia del vento: punta verso dove soffia (la direzione, in gradi, dice da dove arriva) */
function arrow(deg, size) {
  if (!isNum(deg)) return '';
  return `<svg class="ui arw" width="${size || 14}" height="${size || 14}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(${Math.round(deg + 180) % 360}deg)">${UI.freccia}</svg>`;
}
function moonSVG(m, size) {
  var k = Math.max(0, Math.min(1, m.frac)), rx = (9 * Math.abs(1 - 2 * k)).toFixed(2), wax = m.phase < 0.5;
  var lit = `M12 3A9 9 0 0 1 12 21A${rx} 9 0 0 ${k < 0.5 ? 0 : 1} 12 3z`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="var(--card2)" stroke="var(--ink3)" stroke-width="1"/><path d="${lit}" fill="var(--moon)"${wax ? '' : ' transform="translate(24 0) scale(-1 1)"'}/></svg>`;
}
/* Fascia oraria in cui l'indice UV arriva a 3, la soglia da cui serve proteggersi */

function movePlace(id, d) {
  var i = S.places.findIndex(function (p) { return p.id === id; }), j = i + d;
  if (i < 0 || j < 0 || j >= S.places.length) return;
  var t = S.places[i]; S.places[i] = S.places[j]; S.places[j] = t; save(); render();
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest && ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  var fn = ACT[el.getAttribute('data-a')];
  if (fn) { ev.preventDefault(); fn(el); }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'q') { V.q = ev.target.value; clearTimeout(doSearch.t); doSearch.t = setTimeout(doSearch, 320); if (V.q.trim().length < 2) { V.results = null; paintResults(); } }
});
document.addEventListener('change', function (ev) {
  var t = ev.target, p = shown()[0];
  if (t.id === 'pd' && p) { if (validDate(t.value) && t.value <= placeToday(p) && t.value >= '1940-01-01') { V.pdate = t.value; render(); } else toast('Scegli una data tra il 1940 e oggi.'); }
  else if (t.id === 'rf') { V.reg.from = t.value; V.reg.all = false; render(); }
  else if (t.id === 'rt') { V.reg.to = t.value; V.reg.all = false; render(); }
  else if (t.classList && t.classList.contains('rthr')) { V.reg.thr = +t.value; render(); }
  else if (t.id === 'imp' && t.files && t.files[0]) importFile(t.files[0]);
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && V.tip) { V.tip = null; paintTip(); return; }
  if (ev.key === 'Escape' && V.sheet) closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'q') { ev.preventDefault(); clearTimeout(doSearch.t); doSearch(); }
  if ((ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') && document.querySelector('.dv') && !/INPUT|SELECT/.test(ev.target.tagName)) ACT.hour({ getAttribute: function () { return ev.key === 'ArrowLeft' ? -1 : 1; } });
});
document.addEventListener('pointerdown', chartPick);
/* Col mouse, la rotella fa scorrere di lato la striscia delle ore */
document.addEventListener('wheel', function (ev) {
  var h = ev.target.closest && ev.target.closest('.strip');
  if (!h || ev.deltaX || !ev.deltaY) return;
  var max = h.scrollWidth - h.clientWidth;
  if (max <= 0 || (ev.deltaY < 0 && h.scrollLeft <= 0) || (ev.deltaY > 0 && h.scrollLeft >= max)) return;
  ev.preventDefault(); h.scrollLeft += ev.deltaY;
}, { passive: false });
/* Sui computer il selettore della data si apre con un clic in qualsiasi punto del campo */
document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (t && t.tagName === 'INPUT' && t.type === 'date' && t.showPicker && !matchMedia('(pointer: coarse)').matches) { try { t.showPicker(); } catch (e) {} }
});
document.addEventListener('pointermove', chartPick);
window.addEventListener('popstate', function () { route(); render(); });
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); M.install = e; if (V.sheet === 'imp') render(); });
window.addEventListener('afterprint', function () { $('#print').innerHTML = ''; });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { render(); refreshVisible(); } });
window.addEventListener('online', function () { refreshVisible(); });
if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: dark)'), onMq = function () { applySettings(); }; if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); }
/* Girando il telefono o allargando la finestra cambia quanti luoghi stanno affiancati */
var lastCols = maxCols();
window.addEventListener('resize', function () {
  var n = maxCols();
  if (n !== lastCols) { lastCols = n; M.cw = {}; render(); refreshVisible(); }
  else { clearTimeout(M.rt); M.rt = setTimeout(function () { M.cw = {}; fitCharts(); }, 250); }
});
/* A ogni cambio d'ora la schermata si aggiorna da sola */
var lastHour = new Date().getHours();
setInterval(function () {
  if (document.hidden) return;
  var h = new Date().getHours();
  if (h !== lastHour) { lastHour = h; if (!V.sheet) render(); }
  refreshVisible();
}, 6e4);

/* --- avvio --- */
(function () {
  applySettings(); route();
  /* all'avvio si apre il luogo con la stella, a meno che non ci sia un gruppo fissato */
  if (byId(S.def) && !S.cmpOn) S.sel = S.def;
  if (!place()) V.sheet = null;
  render();
  refreshVisible();
  /* splash: resta finché non si tocca (si può togliere dalle Impostazioni) */
  var sp = $('#splash');
  if (sp) {
    if (S.set.splash === 'off') sp.remove();
    else {
      var v = $('#sp-ver'); if (v) v.textContent = VERSION;
      var go = function (e) { if (e && e.type === 'keydown' && !/^(Enter| |Escape)$/.test(e.key)) return; sp.classList.add('out'); document.removeEventListener('keydown', go); setTimeout(function () { sp.remove(); }, 480); };
      sp.addEventListener('click', go); document.addEventListener('keydown', go);
      try { sp.focus({ preventScroll: true }); } catch (e) {}
    }
  }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();

})();
</script>
</body>
</html>
