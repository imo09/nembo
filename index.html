:root{
  --bg:#EDF0EF;--card:#FFFFFF;--card2:#F3F5F4;--ink:#0E1D2A;--ink2:#43515C;--ink3:#5C6973;--line:#DDE3E1;
  --brass:#C99A4E;--brass-ink:#7A5719;--brass-soft:#F5ECDA;
  --rain:#3A6E96;--rain-soft:#D6E3ED;--sun:#C4913F;--cloud:#5C6973;--moon:#75838D;
  --ok:#1E6B60;--ok-soft:#E1EFEC;
  --y:#F2C230;--y-soft:#FBF3D3;--y-ink:#574406;--o:#E8862A;--o-soft:#FCE8D6;--o-ink:#6B380A;--r:#C8372D;--r-soft:#F9E0DD;--r-ink:#7C1C15;
  --shadow:0 1px 2px rgba(14,29,42,.05),0 6px 20px -12px rgba(14,29,42,.12);
  --nav:60px;--font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A151E;--card:#12222F;--card2:#182C3B;--ink:#E9EDEC;--ink2:#B5C1C9;--ink3:#93A1AB;--line:#22384A;
  --brass:#E8A867;--brass-ink:#EDB67C;--brass-soft:#2B261C;
  --rain:#7FB3DA;--rain-soft:#203B51;--sun:#E8A867;--cloud:#A7B4BD;--moon:#C6D0D7;
  --ok:#70CFC0;--ok-soft:#13302E;
  --y-soft:#383010;--y-ink:#F4DB88;--o-soft:#3E250E;--o-ink:#F6C390;--r-soft:#43181A;--r-ink:#F4B3AD;
  --shadow:none;--area:.18;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A151E;--card:#12222F;--card2:#182C3B;--ink:#E9EDEC;--ink2:#B5C1C9;--ink3:#93A1AB;--line:#22384A;
  --brass:#E8A867;--brass-ink:#EDB67C;--brass-soft:#2B261C;
  --rain:#7FB3DA;--rain-soft:#203B51;--sun:#E8A867;--cloud:#A7B4BD;--moon:#C6D0D7;
  --ok:#70CFC0;--ok-soft:#13302E;
  --y-soft:#383010;--y-ink:#F4DB88;--o-soft:#3E250E;--o-ink:#F6C390;--r-soft:#43181A;--r-ink:#F4B3AD;
  --shadow:none;--area:.18;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
a{color:var(--brass-ink)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;flex:none}
.wxi{stroke-width:1.5}.wxi .i-sun{stroke:var(--sun)}.wxi .i-cl{stroke:var(--cloud)}.wxi .i-rn{stroke:var(--rain)}.wxi .i-moon{stroke:var(--moon)}.wxi .i-dot{stroke-width:2.4}
.mark .m-cl{stroke:currentColor;stroke-width:1.6}.mark .m-rn{stroke:var(--brass);stroke-width:1.8}

#app{max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:var(--bg)}
#main{flex:1;padding:2px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav) + env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px));min-width:0}
.welcome-on #top,.welcome-on #nav{display:none}
.where{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 6px;border:0;background:none;border-radius:12px;font-size:19px;font-weight:600;letter-spacing:-.01em;min-width:0}
.where span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.where .ui:last-child{color:var(--ink3)}
.brand{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding-left:6px}
.rb{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:12px;color:var(--ink)}
.rb:disabled{opacity:.3}
.rb:active,.where:active{background:var(--card2)}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:4px;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(12px,env(safe-area-inset-left,0px));background:var(--card);border-top:1px solid var(--line)}
#nav button{flex:1;max-width:170px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;border-radius:14px;font-size:12px;font-weight:500;color:var(--ink3)}
#nav button[aria-current]{color:var(--ink);font-weight:600;background:var(--card2)}
#nav button[aria-current] .ui{color:var(--brass-ink)}

/* adesso */
.now{padding:4px 4px 0}
.now-meta{display:flex;align-items:center;justify-content:space-between;color:var(--ink3);font-size:14px}
.upd{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 8px;margin-right:-8px;border:0;background:none;border-radius:10px;color:var(--ink3);font-size:13px}
.now-top{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.now-t{font-size:96px;font-weight:300;line-height:1;letter-spacing:-.055em;margin-left:-4px}
.now-ic .wxi{stroke-width:1.05}
.now-c{color:var(--ink2);font-size:15px;margin-top:4px}
.say{font-size:27px;line-height:1.16;font-weight:600;letter-spacing:-.02em;margin-top:22px;text-wrap:balance}
.say2{font-size:16px;color:var(--ink2);margin-top:8px;text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips.center{justify-content:center;margin:14px 0 4px}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:13px;white-space:nowrap}
.chip.brass{background:var(--brass-soft);border-color:transparent;color:var(--brass-ink);font-weight:500}
button.chip{min-height:38px;font-size:14px}
button.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}

.h{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:30px 4px 10px}
.h.big{font-size:20px;letter-spacing:-.01em;text-transform:none;color:var(--ink);margin:26px 4px 12px}
.h-row{display:flex;align-items:flex-end;justify-content:space-between}
.link{min-height:44px;padding:0 6px;border:0;background:none;color:var(--brass-ink);font-size:14px;font-weight:600;margin-top:14px}
.lbl{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flush{padding:0;overflow:hidden}
.card.txt{font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:8px;margin-top:12px}
.card+.card{margin-top:12px}
.cap{font-size:12px;color:var(--ink3);padding:0 16px 12px}
.cap.c{text-align:center;padding:2px 0 10px}
.foot{font-size:12px;color:var(--ink3);text-align:center;margin:26px 8px 0;line-height:1.55}
.foot.left{text-align:left;margin:14px 4px 0}

/* ore */
.hours{display:flex;overflow-x:auto;padding:16px 8px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.hours::-webkit-scrollbar{display:none}
.hr{flex:0 0 54px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0;border-radius:14px}
.hr.on{background:var(--card2)}
.hr-h{font-size:12px;color:var(--ink3)}.hr.on .hr-h{color:var(--ink);font-weight:600}
.hr-t{font-size:16px;font-weight:500}
.hr-bar{height:22px;width:10px;display:flex;align-items:flex-end;border-radius:5px;background:var(--card2)}
.hr.on .hr-bar{background:var(--line)}
.hr-bar i{display:block;width:10px;border-radius:5px;background:var(--rain)}
.hr-p{font-size:11px;color:var(--rain);min-height:15px;font-weight:600}
.hr-sep{flex:0 0 30px;display:flex;align-items:center;justify-content:center;border-left:1px dashed var(--line);margin-left:6px}
.hr-sep span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

/* giorni */
.day{display:grid;grid-template-columns:62px 28px 62px 32px minmax(30px,1fr) 32px;align-items:center;column-gap:6px;width:100%;min-height:56px;padding:0 14px 0 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.day:first-child{border-top:0}
.day:active,.pg:active,.res-i:active,.pl-main:active{background:var(--card2)}
.day-n{font-size:15px;font-weight:500}.day.is-today .day-n{font-weight:700}
.day-p{font-size:13px;color:var(--rain);font-weight:600;white-space:nowrap}
.day,.pg,table,.hr,.stats,.pl-t{font-variant-numeric:tabular-nums}
.day-lo{font-size:15px;color:var(--ink3);text-align:right}.day-hi{font-size:15px;font-weight:600;text-align:right}
.rng{position:relative;height:6px;border-radius:3px;background:var(--card2)}
.rng i{position:absolute;top:0;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--rain-soft),var(--brass))}
.day.more{grid-template-columns:24px 1fr 20px;column-gap:12px;font-size:14px;color:var(--ink2)}
.day.more .ui{color:var(--ink3)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:12px;color:var(--ink3)}.tile b{font-size:18px;font-weight:600;letter-spacing:-.01em}.tile small{font-size:12px;color:var(--ink3);min-height:17px}
.tiles.in .tile{background:var(--card2);border-color:transparent}

/* allerte: gli unici colori accesi */
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.lev1{background:var(--y)}.dot.lev2{background:var(--o)}.dot.lev3{background:var(--r)}.dot.lev0{background:transparent;border:2px solid var(--ink3)}
.alert{border-radius:20px;overflow:hidden;background:var(--card);border:1.5px solid var(--line);margin:8px 0 18px}
.now+.alert,.now+.calm,.now+.att,.alert+.att,.calm+.att{margin-top:22px}
.alert-h{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:16px;letter-spacing:.01em}
.alert-h b{font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.alert-h span{margin-left:auto;font-weight:600;font-size:14px}
.alert.lev1{border-color:var(--y)}.alert.lev1 .alert-h{background:var(--y);color:#0E1D2A}
.alert.lev2{border-color:var(--o)}.alert.lev2 .alert-h{background:var(--o);color:#0E1D2A}
.alert.lev3{border-color:var(--r)}.alert.lev3 .alert-h{background:var(--r);color:#fff}
.alert-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.alert-b p{display:flex;gap:10px;font-size:15px;line-height:1.4}.alert-b p .dot{margin-top:6px}.alert-b p b{margin-right:4px}
.alert-b .alert-src{font-size:12px;color:var(--ink3);display:block}
.alert-a{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.alert-a a{flex:1 1 auto;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:12px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.alert-a a:first-child{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.calm{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink2);text-decoration:none;font-size:14px;line-height:1.35;margin-top:22px}
.calm span{flex:1;min-width:0}.calm small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.calm.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}.calm.ok small{color:var(--ok);font-weight:400;opacity:.9}
.calm .ui:last-child{opacity:.6}
.calm.lev1{background:var(--y-soft);border-color:var(--y);color:var(--y-ink);font-weight:600;align-items:flex-start}.calm.lev1 .dot{margin-top:5px;width:12px;height:12px}.calm.lev1 small{color:var(--y-ink);font-weight:400}.calm.lev1 small+small{opacity:.8}
.att{border-radius:16px;background:var(--brass-soft);padding:14px 16px;margin-top:12px;color:var(--ink)}
.att-h{display:flex;align-items:center;gap:8px;color:var(--brass-ink);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.att ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:500;line-height:1.35}
.att p{font-size:12px;color:var(--ink3);margin-top:8px}
.warn{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px dashed var(--ink3);color:var(--ink2);font-size:13px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.off{background:var(--brass-soft);color:var(--brass-ink)}
.pill.lev1{background:var(--y-soft);color:var(--y-ink)}.pill.lev2{background:var(--o-soft);color:var(--o-ink)}.pill.lev3{background:var(--r-soft);color:var(--r-ink)}

/* un giorno */
.dv-say{font-size:20px;font-weight:600;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 6px}
.stats div{display:flex;flex-direction:column;gap:1px}.stats b{font-size:17px;font-weight:600;white-space:nowrap}.stats span{font-size:12px;color:var(--ink3)}
.chart{margin:8px -8px 0;touch-action:pan-y;cursor:crosshair;-webkit-user-select:none;user-select:none}
.chart svg{width:100%;height:auto}
.c-line{fill:none;stroke:var(--brass);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--brass);opacity:var(--area,.1)}.c-bar{fill:var(--rain)}.c-axis{stroke:var(--line);stroke-width:1}
.chart{--halo:var(--card)}.sh .chart{--halo:var(--bg)}
.c-txt,.c-val,.c-rain{paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.c-txt{fill:var(--ink3);font:500 11px var(--font)}.c-val{fill:var(--ink);font:600 12px var(--font)}.c-val.dim{fill:var(--ink3)}
.c-rain{fill:var(--rain);font:600 11px var(--font)}
.c-now{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}
.c-sel{stroke:var(--ink);stroke-width:1.2;opacity:.55}.c-selc{fill:var(--card);stroke:var(--ink);stroke-width:2}
.read{border-top:1px solid var(--line);padding-top:8px}
.read-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.read-h{display:flex;flex-direction:column;align-items:center;gap:2px}.read-h b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.read-h span{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2)}
.read .rb{background:var(--card2)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--ink2);padding:12px 0 0;margin-top:12px;border-top:1px solid var(--line)}
.note .ui{color:var(--brass-ink);margin-top:1px}.note .dot{margin-top:5px}.note b{color:var(--ink)}
.src{font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.5}
.state{padding:36px 12px;text-align:center;color:var(--ink2);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:16px}

/* passato */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin:4px 0 14px}
.seg button{min-height:42px;border:0;border-radius:12px;background:none;font-size:15px;font-weight:500;color:var(--ink2)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,29,42,.12)}
.seg.small{margin:0}
.pick{display:flex;flex-direction:column}
.pick-row{display:flex;align-items:center;gap:8px}
.pick-row .rb{background:var(--card2)}
select{min-height:48px;width:100%;min-width:0;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:16px;font-weight:500;-webkit-appearance:none;appearance:none}
.datef{position:relative;display:block;flex:1;min-width:0}
.datef-l{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden}
.datef-l span{overflow:hidden;text-overflow:ellipsis}.datef-l .ui{color:var(--ink3)}
.datef input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;border:0;padding:0;cursor:pointer;font-size:16px;-webkit-appearance:none;appearance:none}
.datef input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.datef:focus-within .datef-l{outline:2px solid var(--brass);outline-offset:2px}
.pick .chips{margin-top:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.thr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px;color:var(--ink2)}
.thr select{width:auto;min-width:104px;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.legend{display:flex;align-items:center;gap:14px;padding:12px 16px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend span:last-child{margin-left:auto}
.legend i,.pg-b i{display:block;height:8px;border-radius:3px}.legend i{width:16px}
.b1{background:var(--rain-soft)}.b2{background:var(--rain)}
.pg{display:grid;grid-template-columns:88px minmax(0,1fr) auto;align-items:center;column-gap:10px;width:100%;min-height:58px;padding:8px 14px 8px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.legend+.pg{border-top:0}
.pg-d{font-size:14px;font-weight:500}
.pg-b{display:flex;flex-direction:column;gap:5px}.pg-b>span{display:flex;align-items:center;gap:6px}.pg-b i{min-width:2px}.pg-b em{font-style:normal;font-size:11px;color:var(--ink3)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:600;color:var(--ink3);text-align:right;padding:12px 8px;white-space:nowrap;letter-spacing:.02em}
td{text-align:right;padding:11px 8px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:16px}th:last-child,td:last-child{padding-right:16px}
tr.wet td:nth-child(4){color:var(--rain);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border:1px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;text-decoration:none}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.wide{width:100%}.btn:disabled{opacity:.55}
.tiles+.card,.card+.two,.card+.tiles,.pick+.tiles{margin-top:12px}

/* luoghi */
.search{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink3);margin-top:4px}
.search input{flex:1;min-width:0;height:50px;border:0;background:none;outline:0;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.search:focus-within{border-color:var(--brass)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
#results{margin:10px 0}
.res-n{font-size:14px;color:var(--ink2);padding:6px 6px 2px}
.res-i{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--ink3)}
.res-i:first-child{border-top:0}
.res-i span{display:flex;flex-direction:column;min-width:0;color:var(--ink)}.res-i b{font-weight:600}.res-i small,.pl-n small{font-size:13px;color:var(--ink3)}
.places{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.pl.on{border-color:var(--ink)}
.pl-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:72px;padding:12px 16px;border:0;background:none;text-align:left}
.pl-n{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.pl-n b{font-size:17px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-n .pill{margin-top:6px}
.tag{font-style:normal;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--card2);color:var(--ink2);margin-top:2px}
.pl-t{font-size:26px;font-weight:400;letter-spacing:-.03em;min-width:48px;text-align:right}
.pl-ed{display:flex;align-items:center;border-left:1px solid var(--line);padding:0 4px}.pl-ed .del{color:var(--r)}
.welcome{display:flex;flex-direction:column;align-items:center;padding:14vh 4px 0;text-align:center}
.welcome .search,.welcome #results,.welcome .btn{width:100%;text-align:left}.welcome .btn{justify-content:center}
.w-logo{color:var(--ink);margin-bottom:10px}
.w-say{font-size:19px;color:var(--ink2);margin:14px 0 30px;text-wrap:balance}

/* fogli */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh-back{position:absolute;inset:0;background:rgba(6,14,20,.5);animation:fade .2s ease}
.sh{position:relative;width:100%;max-width:540px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 12px 10px 20px}
.sh-top h2{font-size:21px;font-weight:600;letter-spacing:-.01em}.sh-top p{font-size:13px;color:var(--ink3);margin-top:2px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(20px,env(safe-area-inset-left,0px))}
.set .lbl{margin:24px 0 10px}.set .lbl:first-child{margin-top:4px}
.set .p{font-size:14px;color:var(--ink2);line-height:1.5;margin-bottom:10px}
.fonti a{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px 10px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.fonti a:first-child{border-top:0}.fonti span{flex:1;min-width:0;display:flex;flex-direction:column}.fonti b{font-size:15px;font-weight:600}.fonti small{font-size:12px;color:var(--ink3);line-height:1.4}.fonti .ui{color:var(--ink3)}
.about{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:30px;font-size:13px;color:var(--ink3)}.about .wordmark{color:var(--ink)}.about b{color:var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px);z-index:30;transform:translate(-50%,16px);max-width:min(92vw,480px);padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.skel{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.sk{display:block;border-radius:16px;background:var(--card);animation:pulse 1.4s ease-in-out infinite}
.sk1{height:110px;width:55%}.sk2{height:64px}.sk3{height:140px}.sk4{height:56px}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);color:var(--ink);transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .mark{animation:float .9s ease both}#splash .m-rn{animation:rain .9s ease .1s both}#splash .wordmark{animation:fade .6s ease .15s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes float{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes rain{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:359px){.now-t{font-size:80px}.say{font-size:24px}.day{grid-template-columns:54px 26px 56px 30px minmax(20px,1fr) 30px;padding:0 10px 0 12px}.hr{flex-basis:50px}}
@media (min-width:700px){#main{padding-top:8px}.sh{border-radius:24px;margin-bottom:4vh;max-height:88vh}#sheet{align-items:center}}

/* stampa: solo il registro */
#print{display:none}
@media print{
  html,body{background:#fff!important;color:#000!important}
  #app,#sheet,#toast,#splash{display:none!important}
  #print{display:block;font:400 11pt/1.4 var(--font);color:#000;padding:0}
  #print h1{font-size:20pt;font-weight:600;margin:0 0 2pt}#print .p-sub{font-size:12pt;margin:0 0 12pt}
  #print p{margin:0 0 10pt}#print table{width:100%;font-size:10pt;margin-top:6pt}
  #print th{color:#000;font-size:9pt;border-bottom:1.2pt solid #000;padding:4pt 6pt}#print td{border-top:.5pt solid #bbb;padding:3.5pt 6pt}
  #print th:first-child,#print td:first-child{padding-left:0}#print tr.wet td:nth-child(4){color:#000;font-weight:700}
  #print td:nth-child(n+6),#print th:nth-child(n+6){text-align:left}
  #print .p-foot{font-size:8.5pt;color:#444;margin-top:12pt}
  thead{display:table-header-group}tr{break-inside:avoid}
  @page{margin:16mm 14mm}
}

</style>

function dpcNorm(s) {

function dpcParseDay(html) {
  var out = [], cur = null;
  String(html || '').split(/<br\s*\/?>/i).forEach(function (line) {
    var bold = /<b>([\s\S]*?)<\/b>/i.exec(line);
    if (!bold) return;

    var lev = /ALLERTA\s+(GIALLA|ARANCIONE|ROSSA)/.exec(head);

  var arcs = topo.arcs.map(function (a) {

    return a.map(function (p) { if (tr) { x += p[0]; y += p[1]; return [x * sx + tx, y * sy + ty]; } return [p[0], p[1]]; });

    return { name: g.properties && g.properties['Nome zona'], props: g.properties, polys: polys.map(function (p) { return p.map(ring); }) };

}
function printHTML(p) {

/* --- Luoghi e ricerca --- */
function searchBox() {

}
function resultsHTML() {

function viewLuoghi() { return searchBox() + '<div id="plist">' + listHTML() + '</div>'; }

function viewWelcome() {

/* ---------- stato, navigazione, eventi ---------- */
var S = (function () {
  var s = store.get('nembo.s');
  if (!s || !Array.isArray(s.places)) s = { places: [], sel: null, set: {} };
  s.set = { theme: s.set && s.set.theme || 'auto', temp: s.set && s.set.temp || 'C', wind: s.set && s.set.wind || 'kmh' };
  return s;
})();
var M = { fc: {}, busy: {}, err: {}, norm: {}, normTry: 0, dpc: store.get('nembo.dpc'), dpcTry: 0, zones: null, zonesBusy: false, days: {}, prev: {}, reg: null, chart: null, install: null };
var V = { tab: 'oggi', sheet: null, pmode: 'giorno', pdate: null, pagN: 7, reg: null, q: '', results: null, searching: false, searchErr: false, edit: false, hsel: {}, geoBusy: false };
var FRESH = 15 * 6e4;
function $(s) { return document.querySelector(s); }
function save() { store.set('nembo.s', S); }
function place() { for (var i = 0; i < S.places.length; i++) if (S.places[i].id === S.sel) return S.places[i]; return S.places[0] || null; }
function fcOf(p) {
  if (!(p.id in M.fc)) { var c = store.get('nembo.fc.' + p.id); M.fc[p.id] = c && c.d && c.d.hourly ? c : null; }
  return M.fc[p.id];
}
function normOf(p) {
  if (!(p.id in M.norm)) M.norm[p.id] = store.get('nembo.nm.' + p.id);
  return M.norm[p.id];
}
function applySettings() {
  UNITS.temp = S.set.temp; UNITS.wind = S.set.wind;
  var r = document.documentElement;
  if (S.set.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.set.theme);
  var dark = S.set.theme === 'dark' || (S.set.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var m = $('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#0A151E' : '#EDF0EF');
}
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 3200);
}

/* --- caricamenti --- */
function refresh(p, force) {
  if (!p || M.busy[p.id]) return;
  var f = fcOf(p);
  if (!force && f && Date.now() - f.at < FRESH) return;
  M.busy[p.id] = true;
  if (force) render();
  fetchForecast(p).then(function (d) {
    if (!d || !d.hourly || !d.daily) throw new Error('Risposta inattesa');
    M.fc[p.id] = { at: Date.now(), d: d }; delete M.err[p.id];
    store.set('nembo.fc.' + p.id, M.fc[p.id]);
  }, function (e) { M.err[p.id] = e; }).catch(function (e) { M.err[p.id] = e; }).then(function () {
    M.busy[p.id] = false; render();
    if (p === place()) ensureNorm(p);
  });
}
function refreshVisible(force) {
  var p = place();
  refresh(p, force);
  if (V.tab === 'luoghi') S.places.forEach(function (x, i) { if (x !== p) setTimeout(function () { refresh(x, force); }, 250 * (i + 1)); });
  ensureDpc();
}
/* La media climatica pesa come molte richieste: una alla volta, e non più di una ogni due minuti */
function ensureNorm(p) {
  if (!p || normOf(p) || M.normBusy || Date.now() - M.normTry < 2 * 6e4 || !fcOf(p)) return;
  M.normBusy = true; M.normTry = Date.now();
  fetchNormals(p).then(function (n) { M.norm[p.id] = n; store.set('nembo.nm.' + p.id, n); render(); }, function () {}).then(function () { M.normBusy = false; });
}
function ensureDpc() {
  if (!S.places.some(isIt)) return;
  if (!dpcStale(M.dpc, M.dpcTry, Date.now())) { ensureZones(); return; }
  M.dpcTry = Date.now();
  dpcLatestId().then(function (id) {
    if (M.dpc && M.dpc.id === id) return M.dpc;
    return dpcLoad(id);
  }).then(function (c) {
    M.dpc = c; store.set('nembo.dpc', c); render(); ensureZones();
  }, function () { render(); ensureZones(); });
}
function zoneDue(p) { return isIt(p) && (!p.zoneAt || diffDays(devToday(), p.zoneAt) > 30); }
function ensureZones() {
  if (!M.dpc || M.zonesBusy || !S.places.some(zoneDue)) return;
  M.zonesBusy = true;
  (M.zones ? Promise.resolve(M.zones) : dpcTopo(M.dpc.id)).then(function (z) {
    M.zones = z;
    S.places.forEach(function (p) { if (zoneDue(p)) { p.zone = zoneAt(z, p.lat, p.lon) || ''; p.zoneAt = devToday(); } });
    save(); render();
    setTimeout(function () { M.zones = null; }, 2 * 6e4);
  }, function () {}).then(function () { M.zonesBusy = false; });
}

/* --- luoghi --- */
function addPlace(r) {
  var id = 'p' + (+r.lat).toFixed(3) + '_' + (+r.lon).toFixed(3), old = S.places.filter(function (p) { return p.id === id; })[0];
  if (!old) S.places.push({ id: id, name: r.name, admin: r.admin || '', country: r.country || '', cc: r.cc || '', lat: +r.lat, lon: +r.lon });
  S.sel = id; save();
  V.q = ''; V.results = null; V.edit = false;
  setTab('oggi'); refreshVisible();
}
function useHere() {
  if (!navigator.geolocation) { toast('Questo browser non offre la posizione.'); return; }
  V.geoBusy = true; render();
  navigator.geolocation.getCurrentPosition(function (pos) {
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    S.places = S.places.filter(function (p) { return !p.here; });
    var p = { id: 'qui', name: 'La mia posizione', admin: '', country: '', cc: '', lat: lat, lon: lon, here: true };
    S.places.unshift(p); S.sel = p.id; save();
    delete M.fc.qui; delete M.norm.qui; store.del('nembo.fc.qui'); store.del('nembo.nm.qui');
    V.geoBusy = false; V.q = ''; V.results = null;
    setTab('oggi'); refreshVisible(true);
    reverseName(lat, lon).then(function (n) { if (n.name) { p.name = n.name; p.admin = n.admin; p.country = n.country; p.cc = n.cc; save(); render(); ensureDpc(); } }, function () {});
  }, function (e) {
    V.geoBusy = false; render();
    toast(e && e.code === 1 ? 'Posizione non autorizzata. Puoi cercare la località per nome.' : 'Non riesco a trovare la posizione. Riprova o cerca per nome.');
  }, { timeout: 15000, maximumAge: 10 * 6e4 });
}
function forget(id) { delete M.fc[id]; delete M.norm[id]; store.del('nembo.fc.' + id); store.del('nembo.nm.' + id); }
var searchSeq = 0;
function doSearch() {
  var q = V.q.trim(), seq = ++searchSeq;
  if (q.length < 2) { V.results = null; V.searching = false; paintResults(); return; }
  V.searching = true; V.searchErr = false; paintResults();
  searchPlaces(q).then(function (r) { if (seq === searchSeq) { V.results = r; V.searching = false; paintResults(); } }, function () { if (seq === searchSeq) { V.results = null; V.searching = false; V.searchErr = true; paintResults(); } });
}
function paintResults() { var el = $('#results'); if (el) el.innerHTML = resultsHTML(); }
function paintSearch() {
  paintResults();
  var g = $('#geo'), q = $('#q');
  if (g) { g.disabled = V.geoBusy; g.lastChild.textContent = V.geoBusy ? 'Cerco la posizione…' : 'Usa la mia posizione'; }
  if (q && q.value !== V.q && document.activeElement !== q) q.value = V.q;
}

/* --- navigazione --- */
function setTab(t) {
  V.tab = t; V.sheet = null;
  try { history.replaceState(null, '', '#' + t); } catch (e) {}
  render(); window.scrollTo(0, 0);
  if (t === 'luoghi') refreshVisible();
}
function openSheet(name) {
  V.sheet = name;
  try { history.pushState({ sheet: 1 }, '', '#' + V.tab + '/' + name); } catch (e) {}
  render();
  var c = $('#sheet .sh-x'); if (c) c.focus();
}
function closeSheet() {
  if (history.state && history.state.sheet) history.back(); else { V.sheet = null; render(); }
}
function route() {
  var h = (location.hash || '').slice(1).split('/');
  V.tab = /^(oggi|passato|luoghi)$/.test(h[0]) ? h[0] : 'oggi';
  V.sheet = h[1] && /^(imp|g-\d{4}-\d{2}-\d{2})$/.test(h[1]) ? h[1] : null;
}

/* --- disegno --- */
function render() {
  var p = place(), app = $('#app'), keep = {};
  [].forEach.call(document.querySelectorAll('[data-keep]'), function (el) { keep[el.getAttribute('data-keep')] = el.scrollLeft; });
  var focusId = document.activeElement && document.activeElement.id;
  if (!p) {
    app.className = 'welcome-on';
    $('#top').innerHTML = ''; $('#nav').innerHTML = '';
    if ($('#main .welcome')) paintSearch(); else $('#main').innerHTML = viewWelcome();
    paintSheet(null);
    return;
  }
  app.className = 'tab-' + V.tab;
  $('#top').innerHTML = (V.tab === 'luoghi' ? `<span class="brand">${logoMark(26)}${wordmark(19)}</span>` : `<button class="where" data-a="tab" data-tab="luoghi" aria-label="Luogo: ${esc(p.name)}. Cambia luogo">${ic('pin', 20)}<span>${esc(p.name)}</span>${ic('giu', 18)}</button>`) +
    `<button class="rb" data-a="sheet" data-s="imp" aria-label="Impostazioni">${ic('ingranaggio', 22)}</button>`;
  /* in Luoghi il campo di ricerca non si ridisegna, così la tastiera resta aperta mentre si scrive */
  if (V.tab === 'luoghi' && $('#main #plist')) { $('#plist').innerHTML = listHTML(); paintSearch(); }
  else $('#main').innerHTML = V.tab === 'passato' ? viewPassato(p) : V.tab === 'luoghi' ? viewLuoghi() : viewOggi(p);
  $('#nav').innerHTML = [['oggi', 'Oggi', 'oggi'], ['passato', 'Passato', 'passato'], ['luoghi', 'Luoghi', 'pin']].map(function (t) {
    return `<button data-a="tab" data-tab="${t[0]}"${V.tab === t[0] ? ' aria-current="page"' : ''}>${ic(t[2], 22)}<span>${t[1]}</span></button>`;
  }).join('');
  paintSheet(p);
  Object.keys(keep).forEach(function (k) { var el = document.querySelector('[data-keep="' + k + '"]'); if (el) el.scrollLeft = keep[k]; });
  if (focusId && focusId !== 'q') { var f = document.getElementById(focusId); if (f && f !== document.activeElement) try { f.focus({ preventScroll: true }); } catch (e) {} }
}
function paintSheet(p) {
  var sh = $('#sheet'), html = '';
  if (p && V.sheet === 'imp') html = sheetWrap('Impostazioni', '', sheetSettings());
  else if (p && V.sheet && V.sheet.indexOf('g-') === 0) {
    var date = V.sheet.slice(2), today = placeToday(p), rel = diffDays(date, today);
    html = sheetWrap(cap(fmtDay(date, Math.abs(rel) > 200 ? 'anno' : undefined)), rel === 0 ? 'Oggi, ora per ora' : rel > 0 ? 'Previsione' : "Com'è andata", dayView(p, date));
  }
  var was = !sh.hidden, sc = was && $('#sheet .sh-body') ? $('#sheet .sh-body').scrollTop : 0;
  sh.innerHTML = html; sh.hidden = !html;
  document.documentElement.classList.toggle('locked', !!html);
  if (html && was && $('#sheet .sh-body')) $('#sheet .sh-body').scrollTop = sc;
}
function sheetWrap(title, sub, body) {
  return `<div class="sh-back" data-a="close"></div><div class="sh" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh-top"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div><button class="rb sh-x" data-a="close" aria-label="Chiudi">${ic('chiudi', 22)}</button></div><div class="sh-body">${body}</div></div>`;
}

/* --- grafico: scegliere un'ora --- */
function setHour(k) {
  var c = M.chart; if (!c) return;
  k = Math.max(0, Math.min(c.n - 1, k));
  var dv = document.querySelector('.dv'), date = dv && dv.getAttribute('data-date');
  if (date) V.hsel[date] = k;
  var l = $('#mkl'), d = $('#mkc'), r = $('#read');
  if (l) { l.setAttribute('x1', c.xs[k]); l.setAttribute('x2', c.xs[k]); }
  if (d) { d.setAttribute('cx', c.xs[k]); if (c.ys[k] !== null) d.setAttribute('cy', c.ys[k]); }
  if (r) { var p = place(), past = date && p ? diffDays(date, placeToday(p)) < 0 : false; r.innerHTML = readHTML(c.H, c.s + k, !past); }
}
function chartPick(ev) {
  var box = ev.target.closest && ev.target.closest('.chart');
  if (!box || !M.chart) return;
  if (ev.type === 'pointermove' && ev.pointerType === 'mouse' && !ev.buttons) return;
  var r = box.querySelector('svg').getBoundingClientRect(), c = M.chart;
  setHour(Math.floor(((ev.clientX - r.left) / r.width * c.W - c.L) / c.step));
}

/* --- file --- */
function saveFile(name, text, type) {
  var blob = new Blob([text], { type: type });
  try {
    var file = new File([blob], name, { type: type });
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function () {});
      return;
    }
  } catch (e) {}
  var a = document.createElement('a'), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  toast('File salvato: ' + name);
}
function slug(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'luogo'; }
function importFile(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var j = JSON.parse(r.result), n = 0;
      if (!j || j.app !== 'nembo' || !Array.isArray(j.places)) throw new Error('formato');
      j.places.forEach(function (p) {
        if (!p || !p.id || !isNum(+p.lat) || !isNum(+p.lon) || !p.name || p.here) return;
        if (S.places.some(function (x) { return x.id === p.id; })) return;
        S.places.push({ id: String(p.id), name: String(p.name), admin: String(p.admin || ''), country: String(p.country || ''), cc: String(p.cc || ''), lat: +p.lat, lon: +p.lon }); n++;
      });
      if (j.set) ['theme', 'temp', 'wind'].forEach(function (k) { if (typeof j.set[k] === 'string') S.set[k] = j.set[k]; });
      if (!S.sel && S.places[0]) S.sel = S.places[0].id;
      save(); applySettings(); render(); refreshVisible();
      toast(n ? 'Aggiunti ' + n + (n === 1 ? ' luogo.' : ' luoghi.') : 'Nessun luogo nuovo da aggiungere.');
    } catch (e) { toast('Questo file non è un salvataggio di nembo.'); }
  };
  r.readAsText(file);
}

/* --- eventi --- */
var ACT = {
  tab: function (el) { setTab(el.getAttribute('data-tab')); },
  sheet: function (el) { openSheet(el.getAttribute('data-s')); },
  close: function () { closeSheet(); },
  day: function (el) { openSheet('g-' + el.getAttribute('data-date')); },
  refresh: function () { refreshVisible(true); },
  'retry-day': function () { Object.keys(M.days).forEach(function (k) { if (M.days[k].err) delete M.days[k]; }); render(); },
  'retry-prev': function () { Object.keys(M.prev).forEach(function (k) { if (M.prev[k].err) delete M.prev[k]; }); render(); },
  'retry-reg': function () { M.reg = null; render(); },
  hour: function (el) { var dv = document.querySelector('.dv'), date = dv && dv.getAttribute('data-date'), k = V.hsel[date]; if (k == null && M.chart) k = Math.round(($('#mkl').getAttribute('x1') - M.chart.L) / M.chart.step - 0.5); setHour((k || 0) + (+el.getAttribute('data-d'))); },
  pmode: function (el) { V.pmode = el.getAttribute('data-m'); render(); },
  pd: function (el) { var p = place(), t = placeToday(p), d = addDays(V.pdate, +el.getAttribute('data-d')); if (d <= t && d >= '1940-01-01') { V.pdate = d; render(); } },
  pdset: function (el) { V.pdate = el.getAttribute('data-date'); render(); },
  pagn: function (el) { V.pagN = +el.getAttribute('data-n'); render(); },
  regset: function (el) { V.reg.from = el.getAttribute('data-f'); V.reg.to = el.getAttribute('data-t'); V.reg.all = false; render(); },
  regall: function () { V.reg.all = true; render(); },
  csv: function () { var p = place(); if (M.reg && M.reg.rows) saveFile('nembo-registro-' + slug(p.name) + '-' + V.reg.from + '_' + V.reg.to + '.csv', csvRegistro(p.name, M.reg.rows, V.reg.thr), 'text/csv;charset=utf-8'); },
  pdf: function () { var p = place(); if (!M.reg || !M.reg.rows) return; $('#print').innerHTML = printHTML(p); setTimeout(function () { window.print(); }, 60); },
  pick: function (el) { var r = V.results && V.results[+el.getAttribute('data-i')]; if (r) addPlace(r); },
  geo: function () { useHere(); },
  sel: function (el) { S.sel = el.getAttribute('data-id'); save(); V.edit = false; setTab('oggi'); refreshVisible(); },
  edit: function () { V.edit = !V.edit; render(); },
  up: function (el) { movePlace(el.getAttribute('data-id'), -1); },
  down: function (el) { movePlace(el.getAttribute('data-id'), 1); },
  del: function (el) {
    var id = el.getAttribute('data-id'); S.places = S.places.filter(function (p) { return p.id !== id; }); forget(id);
    if (S.sel === id) S.sel = S.places[0] ? S.places[0].id : null;
    if (!S.places.length) { V.edit = false; V.tab = 'oggi'; V.q = ''; V.results = null; }
    save(); render();
  },
  set: function (el) { S.set[el.getAttribute('data-k')] = el.getAttribute('data-v'); save(); applySettings(); render(); },
  export: function () { saveFile('nembo-luoghi.json', JSON.stringify({ app: 'nembo', v: 1, places: S.places.filter(function (p) { return !p.here; }), set: S.set }, null, 1), 'application/json'); },
  install: function () { if (M.install) { M.install.prompt(); M.install = null; render(); } }
};
function movePlace(id, d) {
  var i = S.places.findIndex(function (p) { return p.id === id; }), j = i + d;
  if (i < 0 || j < 0 || j >= S.places.length) return;
  var t = S.places[i]; S.places[i] = S.places[j]; S.places[j] = t; save(); render();
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest && ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  var fn = ACT[el.getAttribute('data-a')];
  if (fn) { ev.preventDefault(); fn(el); }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'q') { V.q = ev.target.value; clearTimeout(doSearch.t); doSearch.t = setTimeout(doSearch, 320); if (V.q.trim().length < 2) { V.results = null; paintResults(); } }
});
document.addEventListener('change', function (ev) {
  var t = ev.target, p = place();
  if (t.id === 'pd' && p) { if (validDate(t.value) && t.value <= placeToday(p) && t.value >= '1940-01-01') { V.pdate = t.value; render(); } else toast('Scegli una data tra il 1940 e oggi.'); }
  else if (t.id === 'rf') { V.reg.from = t.value; V.reg.all = false; render(); }
  else if (t.id === 'rt') { V.reg.to = t.value; V.reg.all = false; render(); }
  else if (t.id === 'rthr') { V.reg.thr = +t.value; render(); }
  else if (t.id === 'imp' && t.files && t.files[0]) importFile(t.files[0]);
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && V.sheet) closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'q') { ev.preventDefault(); clearTimeout(doSearch.t); doSearch(); }
  if ((ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') && document.querySelector('.dv') && !/INPUT|SELECT/.test(ev.target.tagName)) ACT.hour({ getAttribute: function () { return ev.key === 'ArrowLeft' ? -1 : 1; } });
});
document.addEventListener('pointerdown', chartPick);
/* Col mouse, la rotella fa scorrere di lato la striscia delle ore */
document.addEventListener('wheel', function (ev) {
  var h = ev.target.closest && ev.target.closest('.hours');
  if (!h || ev.deltaX || !ev.deltaY) return;
  var max = h.scrollWidth - h.clientWidth;
  if ((ev.deltaY < 0 && h.scrollLeft <= 0) || (ev.deltaY > 0 && h.scrollLeft >= max)) return;
  ev.preventDefault(); h.scrollLeft += ev.deltaY;
}, { passive: false });
/* Sui computer il selettore della data si apre con un clic in qualsiasi punto del campo */
document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (t && t.tagName === 'INPUT' && t.type === 'date' && t.showPicker && !matchMedia('(pointer: coarse)').matches) { try { t.showPicker(); } catch (e) {} }
});
document.addEventListener('pointermove', chartPick);
window.addEventListener('popstate', function () { route(); render(); });
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); M.install = e; if (V.sheet === 'imp') render(); });
window.addEventListener('afterprint', function () { $('#print').innerHTML = ''; });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { render(); refreshVisible(); } });
window.addEventListener('online', function () { refreshVisible(); });
if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: dark)'), onMq = function () { applySettings(); }; if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); }
/* A ogni cambio d'ora la schermata si aggiorna da sola */
var lastHour = new Date().getHours();
setInterval(function () {
  if (document.hidden) return;
  var h = new Date().getHours();
  if (h !== lastHour) { lastHour = h; if (!V.sheet) render(); }
  refreshVisible();
}, 6e4);

/* --- avvio --- */
(function () {
  applySettings(); route();
  if (!place()) V.sheet = null;
  render();
  refreshVisible();
  var p = place(); if (p) ensureNorm(p);
  var sp = $('#splash');
  if (sp) setTimeout(function () { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 450); }, 550);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();

})();
</script>
